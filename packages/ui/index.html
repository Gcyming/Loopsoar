<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'"
    />
    <link rel="icon" type="image/png" href="./logo.png" />
    <title>Loopsoar</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #111318;
        color: #f4efe6;
      }
      #root {
        height: 100vh;
      }

      /* ── 图标（mask 染色）：SVG 只作形状，颜色跟随当前文字色，主题切换零成本 ── */
      .icon {
        display: inline-block;
        flex: none;
        background-color: currentColor;
        -webkit-mask: var(--icon) center / contain no-repeat;
        mask: var(--icon) center / contain no-repeat;
      }

      /* ── 通用交互态（借鉴 slime：hover 上浮 1px + 软阴影，active 按下回弹） ── */
      .btn-primary {
        transition: background 120ms, color 120ms, transform 80ms, box-shadow 120ms;
      }
      .btn-primary:hover:not(:disabled) {
        background: #d98a4f;
        transform: translateY(-1px);
        box-shadow: 0 2px 10px rgba(200, 118, 60, 0.28);
      }
      .btn-primary:active:not(:disabled) {
        transform: translateY(0) scale(0.97);
        box-shadow: none;
      }
      .btn-primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .btn-ghost {
        transition: border-color 120ms, color 120ms, background 120ms, transform 80ms;
      }
      .btn-ghost:hover:not(:disabled) {
        border-color: #c8763c;
        color: #f4efe6;
        background: rgba(200, 118, 60, 0.1);
        transform: translateY(-1px);
      }
      .btn-ghost:active:not(:disabled) {
        transform: translateY(0) scale(0.97);
      }
      .btn-ghost:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* 图标按钮：清脆的按下反馈（scale .88 借鉴 slime 的 titlebar-btn） */
      .icon-btn {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: #a8a29a;
        cursor: pointer;
        transition: background 120ms, color 120ms, transform 80ms;
      }
      .icon-btn:hover:not(:disabled) {
        background: #1e2127;
        color: #f4efe6;
      }
      .icon-btn:active:not(:disabled) {
        transform: scale(0.88);
      }
      .icon-btn:disabled {
        opacity: 0.32;
        cursor: default;
      }

      /* 键盘可达性：焦点环（鼠标点击不触发） */
      .icon-btn:focus-visible,
      .btn-primary:focus-visible,
      .btn-ghost:focus-visible,
      .win-btn:focus-visible,
      textarea:focus-visible,
      input:focus-visible {
        outline: 2px solid rgba(200, 118, 60, 0.6);
        outline-offset: 2px;
      }

      .win-btn {
        transition: background-color 120ms ease, color 120ms ease, transform 80ms;
      }
      .win-btn:hover {
        background: #1e2127;
        color: #f4efe6;
      }
      .win-btn:active {
        transform: scale(0.9);
      }
      .win-close:hover {
        background: #c42b1c;
        color: #ffffff;
      }

      /* ── 动画（全部可在 prefers-reduced-motion 下降级） ── */
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .spinner {
        animation: spin 1s linear infinite;
      }

      /* 流式光标：闪烁块（blink 借鉴 slime 的思考/吐字光标） */
      @keyframes blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }
      .stream-caret {
        display: inline-block;
        width: 7px;
        height: 13px;
        margin-left: 2px;
        vertical-align: -2px;
        border-radius: 1px;
        background: #c8763c;
        animation: blink 1s step-end infinite;
      }

      /* 流式吐字「逐单元渐入」：由右到左 + 由浅到深。
         位移用 relative/left 而非 transform —— 内联元素上 transform 会被静默忽略
         （slime 踩过的坑，这里直接按正确写法实现）。 */
      @keyframes streamUnitIn {
        from {
          opacity: 0;
          left: 3px;
        }
        to {
          opacity: 1;
          left: 0;
        }
      }
      .stream-tail {
        position: relative;
        animation: streamUnitIn 260ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
      }

      /* 新消息行淡入（只做淡入，不做大幅位移：浮层/列表不加"进场"动画避免抽搐） */
      @keyframes fadeOnly {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .msg-enter {
        animation: fadeUp 180ms ease-out both;
      }

      /* 状态点脉冲（在线/思考中） */
      @keyframes pulseDot {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.45;
          transform: scale(0.78);
        }
      }
      .live-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #c8763c;
        animation: pulseDot 2.4s ease-in-out infinite;
      }

      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .toast {
        animation: toastIn 180ms ease-out both;
      }

      textarea:focus,
      input:focus {
        border-color: #6f6a63;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a2d36;
        border-radius: 6px;
        border: 2px solid #111318;
        transition: background 120ms;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3a3e48;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* 设置面板：左侧导航选中态（细条 + 背景） */
      .settings-nav-item:hover {
        background: #1e2127;
        color: #f4efe6;
      }
      .settings-nav-item.is-active {
        box-shadow: inset 2px 0 0 #c8763c;
      }
      .settings-seg:hover:not(.is-active) {
        background: #1e2127;
        color: #f4efe6;
      }
      .settings-toggle:hover {
        border-color: #c8763c;
      }
      /* 输入区能力条（Loopsoar 自有风格：Claude 式圆角容器 + 品牌赭石强调） */
      /* 分区过渡：切换设置页时的轻量入场（不打断阅读，仅位移 4px） */
      @keyframes sectionIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes popIn {
        from { opacity: 0; transform: translateY(-4px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .settings-section {
        animation: sectionIn 180ms ease both;
      }
      .pop-in {
        animation: popIn 120ms ease both;
        transform-origin: top center;
      }
      .panel-card {
        transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
      }
      .panel-card:hover {
        border-color: #3a4150;
        background: #1a1d23;
        transform: translateY(-1px);
      }
      html[data-animations="off"] .settings-section,
      html[data-animations="off"] .pop-in {
        animation: none;
      }
      html[data-animations="reduced"] .settings-section,
      html[data-animations="reduced"] .pop-in {
        animation: fadeOnly 120ms ease both;
      }
      .add-card:hover {
        border-color: #c8763c;
        color: #f4efe6;
      }
      .chip {
        transition: border-color 120ms, color 120ms, background 120ms, transform 80ms;
      }
      .chip:hover {
        border-color: #c8763c;
        color: #f4efe6;
      }
      .chip:active {
        transform: scale(0.97);
      }
      .perm-seg {
        transition: background 120ms, color 120ms;
      }
      .perm-seg:hover {
        color: #f4efe6;
      }
      .send-btn {
        transition: transform 80ms, background 120ms;
      }
      .send-btn:hover:not(:disabled) {
        background: #d98a4f;
        transform: scale(1.06);
      }
      .send-btn:active:not(:disabled) {
        transform: scale(0.92);
      }
      .send-btn:disabled {
        cursor: default;
      }
      /* 输入框聚焦时容器描边（容器状态由 :focus-within 表达） */
      div:has(> textarea:focus) {
        border-color: #6f6a63;
      }

      /* 动效强度偏好（设置 · 通用）：写到 documentElement[data-animations] */
      html[data-animations="reduced"] * {
        animation-duration: 120ms !important;
        transition-duration: 80ms !important;
      }
      html[data-animations="off"] * {
        animation: none !important;
        transition: none !important;
      }

      /* 减动效：去掉一切位移/缩放，但保留不透明度渐入
         （slime 的教训：整块 animation:none 会让用户"什么都看不到"） */
      @media (prefers-reduced-motion: reduce) {
        .icon-btn:active:not(:disabled),
        .btn-primary:active:not(:disabled),
        .btn-ghost:active:not(:disabled),
        .win-btn:active,
        .btn-primary:hover:not(:disabled),
        .btn-ghost:hover:not(:disabled) {
          transform: none;
        }
        .msg-enter,
        .toast {
          animation: fadeOnly 140ms ease both;
        }
        .stream-tail {
          animation: fadeOnly 140ms ease both;
        }
        .spinner,
        .live-dot,
        .stream-caret {
          animation-duration: 2s;
        }
      }
  
    /* ── slime 风格：会话 UI 动效与思考时间线 ── */
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes streamDotJump {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    @keyframes textScan {
      0% { background-position: 200% 50%; }
      100% { background-position: -200% 50%; }
    }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(10px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes breatheGlow {
      0%, 100% { box-shadow: 0 0 0 3px rgba(200, 118, 60, 0.12); }
      50% { box-shadow: 0 0 0 5px rgba(200, 118, 60, 0.26); }
    }
    .msg-row { user-select: text; animation: msgIn 180ms cubic-bezier(0.2, 0.8, 0.2, 1); }
    .msg-row:hover .msg-hover { opacity: 1; }
    .msg-hover { opacity: 0; transition: opacity 120ms ease; }
    .msg-action {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; padding: 0; border: none; border-radius: 4px;
      background: transparent; color: inherit; cursor: pointer;
      transition: background 120ms, color 120ms, transform 80ms;
    }
    .msg-action:hover { background: rgba(255, 255, 255, 0.08); color: #d98a4f; }
    .msg-action:active { transform: scale(0.9); }
    .stream-dot-row { display: inline-flex; gap: 3px; align-items: center; }
    .stream-dot {
      display: inline-block; width: 4px; height: 4px; border-radius: 50%;
      background: currentColor; animation: streamDotJump 1.2s ease-in-out infinite;
      will-change: transform, opacity;
    }
    .text-scan-light {
      background: linear-gradient(90deg, currentColor 0%, #f2d9c2 50%, currentColor 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textScan 2.2s linear infinite;
    }
    .think-timeline { animation: fadeIn 160ms ease; }
    .think-step { position: relative; margin: 2px 0 7px; animation: fadeIn 160ms ease; }
    .think-step-mark {
      position: absolute; left: -19px; top: 7px; width: 8px; height: 8px;
      border-radius: 50%; background: #c8763c;
      box-shadow: 0 0 0 3px rgba(200, 118, 60, 0.14);
    }
    .think-timeline.is-live .think-step-mark { animation: breatheGlow 1.8s ease-in-out infinite; }
    .think-step-mark[data-state="error"] { background: #f87171; box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.18); }
    .think-step-toggle {
      display: inline-flex; align-items: baseline; gap: 7px; max-width: 100%;
      padding: 0; border: none; background: transparent; cursor: pointer;
      color: #c9c3b6; font-size: 12px; font-weight: 600;
      transition: color 120ms;
    }
    .think-step-toggle:hover { color: #d98a4f; }
    .think-step-preview {
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-weight: 400; font-size: 11.5px; color: #7c766a;
    }
    .think-step-text {
      margin-top: 4px; padding: 2px 4px 2px 10px;
      border-left: 2px solid #2c2c31;
      font-size: 12px; line-height: 1.7; color: #a8a296;
      max-height: 320px; overflow-y: auto; overscroll-behavior: contain;
      white-space: pre-wrap; word-break: break-word;
      animation: fadeIn 160ms ease;
    }
    .think-step-state {
      font-size: 10px; padding: 0 5px; border-radius: 999px;
      border: 1px solid #2c2c31; color: #7c766a;
    }
    .panel-card { animation: panelIn 180ms cubic-bezier(0.2, 0.9, 0.2, 1); }
    .pop-in { transform-origin: bottom right; }
    .settings-overlay { animation: backdropIn 160ms ease; }
    .settings-panel { animation: panelIn 220ms cubic-bezier(0.2, 0.9, 0.2, 1); }
    .chip, .icon-btn, .btn, .settings-nav-item {
      transition: background 140ms ease, color 140ms ease, border-color 140ms ease,
        transform 90ms ease, box-shadow 140ms ease;
    }
    .chip:active, .icon-btn:active, .btn:active { transform: scale(0.96); }
    html[data-animations="off"] .msg-row,
    html[data-animations="off"] .think-step,
    html[data-animations="off"] .think-step-text,
    html[data-animations="off"] .settings-overlay,
    html[data-animations="off"] .settings-panel,
    html[data-animations="off"] .pop-in,
    html[data-animations="off"] .stream-dot,
    html[data-animations="off"] .text-scan-light { animation: none !important; }
  </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
