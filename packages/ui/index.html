    .think-tool-detail-text { word-break: break-all; }
    .think-terminal {
      margin: 6px 0 0; padding: 8px; border-radius: 6px;
      background: #0c0e13; border: 1px solid #2c2c31;
      font-family: ui-monospace, Consolas, monospace; font-size: 11px; line-height: 1.55;
      color: #c9c3b6; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-all;
    }
    .think-tool-result { display: flex; align-items: flex-start; gap: 4px; margin-top: 6px; }
    .think-tool-result-mark { flex-shrink: 0; margin-top: 1px; font-size: 10px; }
    .think-tool-result-text { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
    .think-tool-links { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .think-tool-link {
      font-size: 10.5px; color: var(--ls-accent-hover); background: rgba(var(--ls-accent-rgb), 0.10);
      border: 1px solid #2c2c31; border-radius: 6px; padding: 2px 7px;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      text-decoration: none;
    }
    .think-tool-link:hover { border-color: var(--ls-accent-hover); }

    /* 正文排版（对齐 slime：正文 15px / 思考 12.5px） */
    .msg-body-text { font-size: 15px; line-height: 1.75; color: var(--ls-text); word-break: break-word; }
    .msg-body-text .md-heading { font-weight: 650; }
    .msg-body-text .md-del { opacity: 0.5; }

    @media (prefers-reduced-motion: reduce) {
      .think-step, .think-tool-node { animation: none; }
      .think-timeline.is-live .think-step-mark { animation: none; }
      .todo-announce.is-done .todo-announce-text::after { animation: none; width: 100%; }
    }
    html[data-animations="off"] .collapse,
    html[data-animations="off"] .stream-fade-unit,
    html[data-animations="off"] .think-step,
    html[data-animations="off"] .think-tool-node,
    html[data-animations="off"] .think-tool-status,
    html[data-animations="off"] .todo-announce.is-done .todo-announce-text::after { transition: none; animation: none !important; }


    /* ══ 参考内容 / 访问来源 / 产物 / diff（对齐 slime 的面板样式） ══ */
    .ref-panel { margin: 4px 0 6px; }
    .ref-panel-head {
      display: flex; align-items: center; gap: 6px;
      font-size: 11.5px; color: #a8a296; font-weight: 600;
    }
    .ref-panel-head.is-button { width: 100%; padding: 0; border: none; background: transparent; cursor: pointer; text-align: left; }
    .ref-panel-head.is-button:hover { color: var(--ls-accent-hover); }
    .ref-panel-count {
      font-size: 9.5px; font-weight: 500; color: #7c766a;
      padding: 0 5px; border-radius: 999px; border: 1px solid #2c2c31;
    }
    .ref-panel-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
    .ref-chip {
      font-size: 10.5px; color: #c9c3b6; background: #1a1d24;
      border: 1px solid #2c2c31; border-radius: 6px; padding: 2px 7px;
      max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      text-decoration: none; cursor: default;
    }
    a.ref-chip { color: var(--ls-accent-hover); cursor: pointer; }
    a.ref-chip:hover { border-color: var(--ls-accent-hover); }

    .product-panel { margin: 8px 0 2px; }
    .product-panel-head { font-size: 11.5px; font-weight: 600; color: #a8a296; margin-bottom: 4px; }
    .product-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .product-card {
      border: 1px solid #2c2c31; border-radius: 8px; background: rgba(var(--ls-accent-rgb), 0.04);
      overflow: hidden; max-width: 100%;
    }
    .product-card.is-open { flex: 1 1 100%; }
    .product-card-head {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 5px 8px; border: none; background: transparent; cursor: pointer;
      color: #c9c3b6; font-size: 11.5px; text-align: left;
    }
    .product-card-head:hover { background: rgba(var(--ls-accent-rgb), 0.08); }
    .product-card-icon { font-size: 11px; }
    .product-card-name { font-weight: 600; flex-shrink: 0; color: var(--ls-accent-hover); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .product-card-stat { flex-shrink: 0; font-size: 10.5px; display: inline-flex; gap: 4px; }
    .product-card-path { flex: 1; min-width: 0; font-size: 10px; color: #7c766a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .product-card-body { padding: 0 6px 6px; }

    .think-diff-block { border: 1px solid #2c2c31; border-radius: 6px; overflow: hidden; margin-top: 6px; }
    .think-diff-header {
      display: flex; align-items: center; gap: 8px; padding: 4px 8px;
      border-bottom: 1px solid #2c2c31; background: #1a1d24;
      font-size: 10.5px; color: #a8a296;
    }
    .think-diff-file { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .think-diff-stat { margin-left: auto; display: inline-flex; gap: 6px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .think-diff-add { color: #3fb950; }
    .think-diff-del { color: #f85149; }
    .think-diff-body { max-height: 260px; overflow: auto; background: #0c0e13; }
    .think-diff-row { display: flex; align-items: flex-start; padding: 0 8px; white-space: pre; min-width: 0; font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; line-height: 1.55; }
    .think-diff-row.diff-add { background: rgba(63, 185, 80, 0.14); }
    .think-diff-row.diff-del { background: rgba(248, 81, 73, 0.14); }
    .think-diff-row.diff-eq { opacity: 0.55; }
    .think-diff-mark { flex-shrink: 0; width: 16px; user-select: none; font-weight: 700; color: #7c766a; }
    .think-diff-row.diff-add .think-diff-mark { color: #3fb950; }
    .think-diff-row.diff-del .think-diff-mark { color: #f85149; }
    .think-diff-text { flex: 1; min-width: 0; word-break: break-all; }
    .think-diff-foot { padding: 3px 8px; font-size: 9.5px; background: #1a1d24; border-top: 1px solid #2c2c31; }
    .think-diff-inline { flex-shrink: 0; display: inline-flex; gap: 4px; font-size: 10px; font-variant-numeric: tabular-nums; }


    .compress-note {
      display: flex; align-items: center; gap: 6px;
      margin: 6px 0 2px; padding: 4px 8px;
      font-size: 11px; color: #c9a585;
      border-left: 2px solid rgba(var(--ls-accent-rgb), 0.45);
      background: rgba(var(--ls-accent-rgb), 0.06);
      border-radius: 0 6px 6px 0;
    }
    .compress-note-mark { color: var(--ls-accent-hover); font-size: 10px; }

    /* ── 会话：思考与正文分隔 / 正文后置闸门 / 吐字光标 / 跟随最新 ── */
    .msg-body-divider {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.09);
      margin: 8px 0 10px;
      opacity: 0.8;
    }
    .stream-gate {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #c9c2b4;
      font-size: 14px;
      font-weight: 500;
    }
    .stream-cursor {
      display: inline-block;
      width: 2px;
      height: 16px;
      margin-left: 3px;
      vertical-align: text-bottom;
      background: var(--ls-accent-hover);
      animation: blink 1s step-start infinite;
    }
    .msg-think-toggle {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px;
      border: none;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      color: #a8a296;
    }
    .msg-think-toggle.is-open {
      background: rgba(var(--ls-accent-rgb), 0.14);
      color: var(--ls-accent-hover);
    }
    .chat-scroll { position: relative; }
    .scroll-fade-mask {
      position: absolute;
      left: 0;
      right: 0;
      height: 44px;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.2s ease;
    }
    .scroll-fade-mask.is-top {
      top: 0;
      background: linear-gradient(to bottom, rgba(17, 19, 24, 0.92), transparent);
    }
    .scroll-fade-mask.is-bottom {
      bottom: 0;
      background: linear-gradient(to top, rgba(17, 19, 24, 0.92), transparent);
    }
    .scroll-fade-mask.is-hidden { opacity: 0; }
    .jump-latest {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 8;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(24, 26, 32, 0.92);
      color: var(--ls-accent-hover);
      font-size: 11.5px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }

    /* ══════════════════════════════════════════════════════════════════════
       应用内终端（右侧 Agent 面板底部抽屉）
       颜色对齐 theme.ts 的 BRAND：ink var(--ls-bg) / inkPanel var(--ls-surface) /
       border var(--ls-border) / borderStrong var(--ls-border-strong) / linenMuted var(--ls-text-muted) /
       linenFaint var(--ls-text-faint) / ochre var(--ls-accent) / ochreHover var(--ls-accent-hover) / teal var(--ls-teal)。
       深色输出区与既有 .think-terminal 工具输出区同色（#0c0e13），视觉统一。
       ══════════════════════════════════════════════════════════════════════ */
    .terminal-panel {
      /* 终端局部主题变量（颜色对齐 theme.ts BRAND；输出区与 .think-terminal 同色，深底更耐读） */
      --terminal-output-bg: #0c0e13;
      --terminal-output-fg: #c9c3b6;
      display: flex;
      flex-direction: column;
      flex: none;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
    }
    /* 高度拖拽条：鼠标拖动 / 方向键 / Home·End（role=separator） */
    .terminal-resizer {
      position: relative;
      flex: none;
      height: 6px;
      cursor: row-resize;
      background: transparent;
      outline: none;
      touch-action: none;
    }
    .terminal-resizer::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 2px;
      width: 44px;
      height: 2px;
      transform: translateX(-50%);
      border-radius: 2px;
      background: var(--ls-border-strong);
      transition: background 120ms;
    }
    .terminal-resizer:hover::after,
    .terminal-resizer:focus-visible::after {
      background: var(--ls-accent);
    }
    .terminal-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
      min-height: 24px;
      padding: 0 8px 4px;
    }
    .terminal-profiles {
      display: flex;
      align-items: center;
      /* 允许换行：配置档最多 6 个（cmd / PowerShell / Git Bash / Python / Node / C++），
         单行 + overflow 隐藏会把最后一个 C++ 藏掉，用户以为不可用。换行后全部可见。 */
      flex-wrap: wrap;
      gap: 4px;
      flex: 1;
      min-width: 0;
      padding: 2px 0;
      overflow: visible;
    }
    .terminal-profile {
      display: inline-flex;
      align-items: center;
      flex: none;
      height: 20px;
      padding: 0 7px;
      border-radius: 10px;
      border: 1px solid var(--ls-border);
      background: transparent;
      color: var(--ls-text-muted);
      font-size: 10.5px;
      white-space: nowrap;
      cursor: pointer;
      transition: border-color 120ms, color 120ms, background 120ms, transform 80ms;
    }
    .terminal-profile:hover:not(:disabled) {
      border-color: var(--ls-accent);
      color: var(--ls-text);
    }
    .terminal-profile:active:not(:disabled) {
      transform: scale(0.96);
    }
    .terminal-profile.is-active {
      border-color: rgba(var(--ls-accent-rgb), 0.55);
      background: rgba(var(--ls-accent-rgb), 0.14);
      color: var(--ls-accent-hover);
    }
    .terminal-profile:disabled {
      opacity: 0.34;
      cursor: not-allowed;
    }
    .terminal-hint {
      font-size: 10.5px;
      color: var(--ls-text-faint);
      white-space: nowrap;
    }
    .terminal-close-btn {
      flex: none;
    }
    .terminal-state {
      flex: none;
      font-size: 10px;
      color: var(--ls-text-faint);
    }
    .terminal-state[data-state="ready"] {
      color: var(--ls-teal);
    }
    .terminal-state[data-state="error"] {
      color: var(--ls-danger);
    }
    .terminal-notice {
      flex: none;
      padding: 2px 10px;
      font-size: 10.5px;
      color: var(--ls-accent-hover);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .terminal-tabbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
      padding: 0 8px;
      border-bottom: 1px solid var(--ls-border);
    }
    .terminal-tabs {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .terminal-tabs::-webkit-scrollbar {
      height: 0;
    }
    .terminal-tab {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: none;
      max-width: 150px;
      height: 24px;
      padding: 0 8px;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--ls-text-muted);
      font-size: 11px;
      cursor: pointer;
      transition: color 120ms, border-color 120ms, background 120ms;
    }
    .terminal-tab:hover {
      color: var(--ls-text);
      background: var(--ls-surface-hover);
    }
    .terminal-tab.is-active {
      color: var(--ls-text);
      border-bottom-color: var(--ls-accent);
    }
    .terminal-tab-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .terminal-tab-dot {
      flex: none;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ls-text-faint);
    }
    .terminal-tab-dot[data-state="ready"] {
      background: var(--ls-teal);
    }
    .terminal-tab-dot[data-state="starting"] {
      background: var(--ls-accent);
      animation: pulseDot 1.6s ease-in-out infinite;
    }
    .terminal-tab-dot[data-state="error"] {
      background: var(--ls-danger);
    }
    .terminal-tab-add {
      display: grid;
      place-items: center;
      flex: none;
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: var(--ls-text-muted);
      cursor: pointer;
      transition: background 120ms, color 120ms, transform 80ms;
    }
    .terminal-tab-add:hover:not(:disabled) {
      background: var(--ls-surface-hover);
      color: var(--ls-text);
    }
    .terminal-tab-add:active:not(:disabled) {
      transform: scale(0.9);
    }
    .terminal-tab-add:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .terminal-actions {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex: none;
      padding-left: 4px;
    }
    .terminal-action {
      height: 20px;
      padding: 0 5px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: var(--ls-text-muted);
      font-size: 10px;
      cursor: pointer;
      transition: color 120ms, border-color 120ms, background 120ms;
    }
    .terminal-action:hover:not(:disabled) {
      color: var(--ls-accent-hover);
      border-color: rgba(var(--ls-accent-rgb), 0.4);
      background: rgba(var(--ls-accent-rgb), 0.08);
    }
    .terminal-action:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .terminal-empty {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
      text-align: center;
    }
    .terminal-empty-title {
      font-size: 12px;
      color: #c9c3b6;
    }
    .terminal-empty-hint {
      max-width: 300px;
      font-size: 10.5px;
      line-height: 1.5;
      color: var(--ls-text-faint);
    }
    .terminal-empty-btn {
      height: 24px;
      margin-top: 2px;
      padding: 0 12px;
      border: 1px solid var(--ls-border-strong);
      border-radius: 7px;
      background: transparent;
      color: var(--ls-text-muted);
      font-size: 11.5px;
      cursor: pointer;
    }
    .terminal-empty-btn:hover:not(:disabled) {
      border-color: var(--ls-accent);
      color: var(--ls-text);
    }
    .terminal-empty-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .terminal-output-wrap {
      position: relative;
      display: flex;
      flex: 1;
      min-height: 0;
    }
    .terminal-output {
      flex: 1;
      min-height: 0;
      margin: 0;
      padding: 6px 10px;
      overflow: auto;
      overscroll-behavior: contain;
      background: var(--terminal-output-bg);
      color: var(--terminal-output-fg);
      font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
      font-size: 11.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      outline: none;
    }
    .terminal-output:focus-visible {
      box-shadow: inset 0 0 0 1px rgba(var(--ls-accent-rgb), 0.5);
    }
    .terminal-jump {
      position: absolute;
      right: 10px;
      bottom: 8px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(24, 26, 32, 0.92);
      color: var(--ls-accent-hover);
      font-size: 10.5px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }
    .terminal-jump:hover {
      border-color: rgba(var(--ls-accent-rgb), 0.55);
    }
    .terminal-command {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: none;
      padding: 5px 8px;
      border-top: 1px solid var(--ls-border);
    }
    .terminal-prompt {
      flex: none;
      color: var(--ls-accent);
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
    }
    .terminal-command-input {
      flex: 1;
      min-width: 0;
      height: 24px;
      padding: 0 8px;
      border: 1px solid var(--ls-border);
      border-radius: 6px;
      background: var(--ls-bg);
      color: var(--ls-text);
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11.5px;
      outline: none;
    }
    .terminal-command-input:focus {
      border-color: var(--ls-text-faint);
    }
    .terminal-command-input:disabled {
      opacity: 0.5;
    }
    .terminal-raw-toggle {
      flex: none;
      height: 22px;
      padding: 0 7px;
      border: 1px solid var(--ls-border);
      border-radius: 6px;
      background: transparent;
      color: var(--ls-text-muted);
      font-size: 10.5px;
      cursor: pointer;
      transition: border-color 120ms, color 120ms, background 120ms;
    }
    .terminal-raw-toggle:hover {
      border-color: var(--ls-accent);
      color: var(--ls-text);
    }
    .terminal-raw-toggle.is-on {
      border-color: rgba(var(--ls-accent-rgb), 0.55);
      background: rgba(var(--ls-accent-rgb), 0.14);
      color: var(--ls-accent-hover);
    }
    .terminal-send {
      display: grid;
      place-items: center;
      flex: none;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 6px;
      background: var(--ls-accent);
      cursor: pointer;
      transition: background 120ms, transform 80ms;
    }
    .terminal-send:hover:not(:disabled) {
      background: var(--ls-accent-hover);
      transform: scale(1.05);
    }
    .terminal-send:active:not(:disabled) {
      transform: scale(0.94);
    }
    .terminal-send:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    /* 焦点环（键盘可达）：终端内的按钮/输入区统一品牌赭石描边 */
    .terminal-profile:focus-visible,
    .terminal-tab:focus-visible,
    .terminal-tab-add:focus-visible,
    .terminal-action:focus-visible,
    .terminal-raw-toggle:focus-visible,
    .terminal-send:focus-visible,
    .terminal-empty-btn:focus-visible,
    .terminal-jump:focus-visible {
      outline: 2px solid rgba(var(--ls-accent-rgb), 0.6);
      outline-offset: 1px;
    }
    @media (prefers-reduced-motion: reduce) {
      .terminal-tab-dot[data-state="starting"] {
        animation: none;
      }
    }
    html[data-animations="off"] .terminal-tab-dot {
      animation: none !important;
    }

    /* ══════════════════════════════════════════════════════════════════════
       ask_user 弹窗（Agent 向人提问；模态）
       颜色对齐 theme.ts 的 BRAND：ink var(--ls-bg) / inkRaised var(--ls-surface-raised) /
       border var(--ls-border) / borderStrong var(--ls-border-strong) / linen var(--ls-text) /
       linenMuted var(--ls-text-muted) / linenFaint var(--ls-text-faint) / ochre var(--ls-accent) / ochreHover var(--ls-accent-hover)。
       ══════════════════════════════════════════════════════════════════════ */
    .ask-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(8, 9, 12, 0.6);
      animation: fadeOnly 140ms ease both;
    }
    .ask-dialog {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(520px, 92vw);
      max-height: 82vh;
      padding: 16px;
      border: 1px solid var(--ls-border-strong);
      border-radius: 12px;
      background: var(--ls-surface-raised);
      color: var(--ls-text);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      animation: popIn 140ms ease both;
    }
    .ask-head {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .ask-title {
      font-size: 13px;
      font-weight: 700;
    }
    .ask-question {
      padding: 8px 10px;
      border: 1px solid var(--ls-border);
      border-radius: 8px;
      background: var(--ls-bg);
      color: var(--ls-text);
      font-size: 13.5px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 34vh;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .ask-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 30vh;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .ask-option {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--ls-border);
      border-radius: 8px;
      background: var(--ls-bg);
      color: var(--ls-text);
      font-size: 12.5px;
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      word-break: break-word;
      transition: border-color 120ms, background 120ms, transform 80ms;
    }
    .ask-option:hover {
      border-color: var(--ls-accent);
      background: rgba(var(--ls-accent-rgb), 0.1);
    }
    .ask-option:active {
      transform: scale(0.99);
    }
    .ask-free {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .ask-input {
      width: 100%;
      min-height: 56px;
      max-height: 160px;
      padding: 8px 10px;
      border: 1px solid var(--ls-border);
      border-radius: 8px;
      background: var(--ls-bg);
      color: var(--ls-text);
      font-size: 12.5px;
      line-height: 1.6;
      outline: none;
      resize: vertical;
      box-sizing: border-box;
    }
    .ask-input:focus {
      border-color: var(--ls-text-faint);
    }
    .ask-hint {
      font-size: 10.5px;
      color: var(--ls-text-faint);
    }
    .ask-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 2px;
    }
    .ask-cancel,
    .ask-submit {
      height: 28px;
      padding: 0 12px;
      border-radius: 7px;
      font-size: 12.5px;
      cursor: pointer;
      transition: border-color 120ms, background 120ms, color 120ms;
    }
    .ask-cancel {
      border: 1px solid var(--ls-border-strong);
      background: transparent;
      color: var(--ls-text-muted);
    }
    .ask-cancel:hover {
      border-color: var(--ls-accent);
      color: var(--ls-text);
    }
    .ask-submit {
      border: none;
      background: var(--ls-accent);
      color: var(--ls-bg);
      font-weight: 700;
    }
    .ask-submit:hover:not(:disabled) {
      background: var(--ls-accent-hover);
    }
    .ask-submit:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .ask-option:focus-visible,
    .ask-cancel:focus-visible,
    .ask-submit:focus-visible,
    .ask-input:focus-visible {
      outline: 2px solid rgba(var(--ls-accent-rgb), 0.6);
      outline-offset: 1px;
    }
    @media (prefers-reduced-motion: reduce) {
      .ask-dialog {
        animation: fadeOnly 120ms ease both;
      }
    }
    html[data-animations="off"] .ask-overlay,
    html[data-animations="off"] .ask-dialog {
      animation: none !important;
    }

    /* ══ Agent-Loop 选择器（设置 · 通用；内置 loop 不可删除） ══ */
    .loop-picker {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 380px;
      align-items: stretch;
    }
    .loop-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--ls-border);
      border-radius: 8px;
      background: var(--ls-bg);
      color: var(--ls-text-muted);
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      transition: border-color 120ms, background 120ms, color 120ms;
    }
    .loop-item:hover:not(:disabled) {
      border-color: var(--ls-accent);
      color: var(--ls-text);
    }
    .loop-item.is-active {
      border-color: rgba(var(--ls-accent-rgb), 0.55);
      background: rgba(var(--ls-accent-rgb), 0.14);
      color: var(--ls-text);
    }
    .loop-item:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .loop-item:focus-visible {
      outline: 2px solid rgba(var(--ls-accent-rgb), 0.6);
      outline-offset: 1px;
    }
    .loop-item-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .loop-item-tags {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: none;
    }
    .loop-empty {
      font-size: 11px;
      line-height: 1.6;
      color: var(--ls-text-faint);
    }
    .loop-fallback {
      padding: 6px 8px;
      border-left: 2px solid var(--ls-accent);
      border-radius: 0 7px 7px 0;
      background: rgba(var(--ls-accent-rgb), 0.08);
      color: var(--ls-accent-hover);
      font-size: 10.5px;
      line-height: 1.6;
      word-break: break-word;
    }

    /* ══════════════════════════════════════════════════════════════════════
       书签（顶栏浮层）与页面快照浮层
       颜色对齐 theme.ts 的 BRAND：ink var(--ls-bg) / inkRaised var(--ls-surface-raised) /
       border var(--ls-border) / borderStrong var(--ls-border-strong) / linen var(--ls-text) /
       linenMuted var(--ls-text-muted) / linenFaint var(--ls-text-faint) / ochre var(--ls-accent) / ochreHover var(--ls-accent-hover)。
       ══════════════════════════════════════════════════════════════════════ */

    /* 已收藏星标：品牌赭石高亮（未收藏走 icon-btn 的默认灰） */
    .icon-btn.is-bookmarked {
      color: var(--ls-accent-hover);
    }
    .bookmark-list-btn {
      opacity: 0.7;
    }
    .bookmark-list-btn:hover {
      opacity: 1;
    }
    .bookmark-head {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 6px 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--ls-text);
    }
    .bookmark-count {
      font-size: 9.5px;
      font-weight: 400;
      color: #7c766a;
      padding: 0 5px;
      border-radius: 999px;
      border: 1px solid #2c2c31;
    }
    .bookmark-empty {
      padding: 8px 6px 10px;
      font-size: 11px;
      line-height: 1.6;
      color: var(--ls-text-faint);
    }
    .bookmark-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 320px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .bookmark-row {
      display: flex;
      align-items: center;
      gap: 2px;
      border-radius: 7px;
    }
    .bookmark-row:hover {
      background: var(--ls-surface-hover);
    }
    .bookmark-open {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 6px 8px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--ls-text-muted);
      text-align: left;
      cursor: pointer;
    }
    .bookmark-title {
      font-size: 11.5px;
      color: var(--ls-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }
    .bookmark-url {
      font-size: 10px;
      color: var(--ls-text-faint);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
      font-family: ui-monospace, Consolas, monospace;
    }
    .bookmark-del {
      width: 22px;
      height: 22px;
      flex: none;
      opacity: 0;
      transition: opacity 120ms;
    }
    .bookmark-row:hover .bookmark-del,
    .bookmark-del:focus-visible {
      opacity: 1;
    }
    .bookmark-open:focus-visible,
    .bookmark-del:focus-visible {
      outline: 2px solid rgba(var(--ls-accent-rgb), 0.6);
      outline-offset: 1px;
    }

    /* ── 页面快照浮层（正文可读 + 可交互元素） ── */
    .snapshot-overlay {
      position: fixed;
      inset: 0;
      z-index: 48; /* 低于设置(50)/权限(60)/ask(70)：这些模态打开时快照已让位 */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(8, 9, 12, 0.55);
      animation: fadeOnly 140ms ease both;
    }
    .snapshot-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(720px, 94vw);
      max-height: 84vh;
      padding: 14px 16px;
      border: 1px solid var(--ls-border-strong);
      border-radius: 12px;
      background: var(--ls-surface-raised);
      color: var(--ls-text);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      animation: popIn 140ms ease both;
    }
    .snapshot-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }
    .snapshot-title {
      font-size: 13.5px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .snapshot-url {
      font-size: 10.5px;
      color: var(--ls-text-faint);
      font-family: ui-monospace, Consolas, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .snapshot-meta {
      font-size: 10.5px;
      color: #7c766a;
    }
    .snapshot-text {
      margin: 0;
      padding: 8px 10px;
      min-height: 120px;
      max-height: 38vh;
      overflow: auto;
      overscroll-behavior: contain;
      border: 1px solid var(--ls-border);
      border-radius: 8px;
      background: #0c0e13;
      color: #c9c3b6;
      font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
      font-size: 11.5px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      outline: none;
    }
    .snapshot-text:focus-visible {
      box-shadow: inset 0 0 0 1px rgba(var(--ls-accent-rgb), 0.5);
    }
    .snapshot-elements {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
    }
    .snapshot-elements-title {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ls-text-muted);
    }
    .snapshot-elements-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 20vh;
      overflow-y: auto;
      overscroll-behavior: contain;
      border: 1px solid var(--ls-border);
      border-radius: 8px;
      padding: 6px;
      background: var(--ls-bg);
    }
    .snapshot-element {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 11px;
      line-height: 1.5;
      min-width: 0;
    }
    .snapshot-element-id {
      flex: none;
      color: var(--ls-accent);
      font-family: ui-monospace, Consolas, monospace;
      font-size: 10px;
      min-width: 30px;
    }
    .snapshot-element-tag {
      flex: none;
      font-size: 9.5px;
      color: #7c766a;
      padding: 0 4px;
      border-radius: 5px;
      border: 1px solid #2c2c31;
      background: #1a1d24;
    }
    .snapshot-element-text {
      flex: 1;
      min-width: 0;
      color: #c9c3b6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .snapshot-element-href {
      flex: none;
      max-width: 220px;
      color: var(--ls-accent-hover);
      font-size: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .snapshot-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 2px;
    }
    .snapshot-btn {
      height: 28px;
      padding: 0 12px;
      border: 1px solid var(--ls-border-strong);
      border-radius: 7px;
      background: transparent;
      color: var(--ls-text-muted);
      font-size: 12.5px;
      cursor: pointer;
      transition: border-color 120ms, color 120ms, background 120ms;
    }
    .snapshot-btn:hover:not(:disabled) {
      border-color: var(--ls-accent);
      color: var(--ls-text);
      background: rgba(var(--ls-accent-rgb), 0.08);
    }
    .snapshot-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .snapshot-btn:focus-visible,
    .snapshot-close:focus-visible {
      outline: 2px solid rgba(var(--ls-accent-rgb), 0.6);
      outline-offset: 1px;
    }
    @media (prefers-reduced-motion: reduce) {
      .snapshot-panel {
        animation: fadeOnly 120ms ease both;
      }
    }
    html[data-animations="off"] .snapshot-overlay,
    html[data-animations="off"] .snapshot-panel {
      animation: none !important;
    }

    /* ══════════════════════════════════════════════════════════════════════
       斜杠命令面板（Composer）与首次启动向导（Onboarding）
       颜色对齐 theme.ts BRAND：ink var(--ls-bg) / inkRaised var(--ls-surface-raised) / border var(--ls-border) /
       linen var(--ls-text) / linenMuted var(--ls-text-muted) / linenFaint var(--ls-text-faint) / ochre var(--ls-accent)。
       ══════════════════════════════════════════════════════════════════════ */
    .command-panel {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .command-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 6px 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--ls-text);
    }
    .command-count {
      font-size: 9.5px;
      font-weight: 400;
      color: #7c766a;
      padding: 0 5px;
      border-radius: 999px;
      border: 1px solid #2c2c31;
    }
    .command-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .command-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
      width: 100%;
      padding: 5px 7px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--ls-text-muted);
      text-align: left;
      cursor: pointer;
      transition: background 100ms, color 100ms;
    }
    .command-item.is-active,
    .command-item:hover {
      background: rgba(var(--ls-accent-rgb), 0.12);
      color: var(--ls-text);
    }
    .command-item:focus-visible {
      outline: 2px solid rgba(var(--ls-accent-rgb), 0.6);
      outline-offset: 1px;
    }
    .command-cmd {
      flex: none;
      min-width: 74px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11.5px;
      color: var(--ls-accent-hover);
      font-weight: 600;
    }
    .command-desc {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      color: var(--ls-text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .command-empty {
      padding: 8px 7px;
      font-size: 11px;
      color: var(--ls-text-faint);
    }
    .command-hint {
      padding: 4px 6px 0;
      border-top: 1px solid var(--ls-border);
      font-size: 10px;
      color: var(--ls-text-faint);
    }

    /* ── 首次启动向导 ── */
    .onboarding-overlay {
      position: fixed;
      inset: 0;
      z-index: 46; /* 低于设置(50)/权限(60)/ask(70)：从向导跳设置时设置盖在上面 */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(8, 9, 12, 0.6);
      animation: fadeOnly 140ms ease both;
    }
    .onboarding-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(560px, 92vw);
      max-height: 86vh;
      padding: 16px 18px;
      border: 1px solid var(--ls-border-strong);
      border-radius: 14px;
      background: var(--ls-surface-raised);
      color: var(--ls-text);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      animation: popIn 160ms ease both;
      outline: none;
    }
    .onboarding-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .onboarding-step {
      font-size: 10.5px;
      color: #7c766a;
      letter-spacing: 0.3px;
    }
    .onboarding-dots {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .onboarding-dot {
      width: 18px;
      height: 3px;
      border-radius: 2px;
      background: #2c2c31;
      transition: background 140ms ease;
    }
    .onboarding-dot.is-active {
      background: var(--ls-accent);
    }
    .onboarding-body {
      display: flex;
      flex-direction: column;
      gap: 9px;
      overflow-y: auto;
      min-height: 0;
      padding: 2px 2px 4px;
    }
    .onboarding-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }
    .onboarding-hero {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px;
      border: 1px solid var(--ls-border);
      border-radius: 10px;
      background: var(--ls-bg);
    }
    .onboarding-dim {
      font-size: 12px;
      line-height: 1.7;
      color: var(--ls-text-muted);
    }
    .onboarding-bullets {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .onboarding-bullets li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12.5px;
      line-height: 1.65;
      color: #c9c3b6;
    }
    .onboarding-actions-inline {
      display: flex;
      gap: 8px;
      padding: 2px 0;
    }
    .onboarding-note {
      font-size: 11px;
      line-height: 1.6;
      color: var(--ls-text-faint);
    }
    .onboarding-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 30px;
      padding: 0 14px;
      border-radius: 8px;
      border: none;
      background: var(--ls-accent);
      color: var(--ls-bg);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background 120ms, transform 80ms;
    }
    .onboarding-btn:hover:not(:disabled) {
      background: var(--ls-accent-hover);
      transform: translateY(-1px);
    }
    .onboarding-btn:active:not(:disabled) {
      transform: translateY(0) scale(0.97);
    }
    .onboarding-btn-ghost {
      border: 1px solid var(--ls-border-strong);
      background: transparent;
      color: var(--ls-text-muted);
      font-weight: 400;
    }
    .onboarding-btn-ghost:hover:not(:disabled) {
      border-color: var(--ls-accent);
      background: transparent;
      color: var(--ls-text);
      transform: none;
    }
    .onboarding-btn:focus-visible {
      outline: 2px solid rgba(var(--ls-accent-rgb), 0.6);
      outline-offset: 2px;
    }
    .onboarding-foot {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 4px;
    }
    @media (prefers-reduced-motion: reduce) {
      .onboarding-panel {
        animation: fadeOnly 120ms ease both;
      }
    }
    html[data-animations="off"] .onboarding-overlay,
    html[data-animations="off"] .onboarding-panel,
    html[data-animations="off"] .command-item {
      animation: none !important;
      transition: none !important;
    }

    /* ══════════════════════════════════════════════════════════════════════
       顶栏「更多」菜单（精简网址栏：历史/下载/收藏夹/保存页面/设置收进这里）
       颜色对齐 BRAND：inkRaised var(--ls-surface-raised) / border var(--ls-border) / linen var(--ls-text) /
       linenMuted var(--ls-text-muted) / linenFaint var(--ls-text-faint) / ochre var(--ls-accent)。
       ══════════════════════════════════════════════════════════════════════ */
    .browser-more-menu {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 200px;
    }
    .browser-more-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      height: 30px;
      padding: 0 9px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--ls-text-muted);
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
      transition: background 100ms, color 100ms;
    }
    .browser-more-item:hover:not(:disabled),
    .browser-more-item:focus-visible {
      background: rgba(var(--ls-accent-rgb), 0.12);
      color: var(--ls-text);
      outline: none;
    }
    .browser-more-item:focus-visible {
      box-shadow: inset 0 0 0 1px rgba(var(--ls-accent-rgb), 0.55);
    }
    .browser-more-item:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .browser-more-icon {
      flex: none;
      color: #7c766a;
    }
    .browser-more-item:hover:not(:disabled) .browser-more-icon,
    .browser-more-item:focus-visible .browser-more-icon {
      color: var(--ls-accent-hover);
    }
    .browser-more-label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .browser-more-dot {
      flex: none;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ls-accent);
    }
    .browser-more-sep {
      height: 1px;
      margin: 4px 2px;
      background: var(--ls-border);
    }
    @media (prefers-reduced-motion: reduce) {
      .browser-more-item {
        transition: none;
      }
    }
    html[data-animations="off"] .browser-more-item {
      transition: none !important;
    }

    /* ══════════════════════════════════════════════════════════════════════
       独立浮层窗口（PopoverApp）：index.html?popover=<kind>&lang=<lang>
       主进程用透明子 BrowserWindow 加载同一页面，只显示内部圆角卡片。
       颜色对齐 BRAND：inkRaised var(--ls-surface-raised) / border var(--ls-border) / linen var(--ls-text) /
       linenMuted var(--ls-text-muted) / linenFaint var(--ls-text-faint) / ochre var(--ls-accent)。
       ══════════════════════════════════════════════════════════════════════ */
    /* 浮层模式整页透明：窗口透出网页，只剩卡片（PopoverApp 模块加载时打上 data-popover） */
    html[data-popover],
    html[data-popover] body {
      background: transparent !important;
      overflow: hidden;
    }
    html[data-popover] #root {
      height: auto;
      min-height: 100vh;
    }
    .chrome-pop-shell {
      padding: 8px;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      outline: none;
    }
    .chrome-pop-card {
      display: flex;
      flex-direction: column;
      min-width: 220px;
      max-height: calc(100vh - 16px);
      border-radius: 12px;
      border: 1px solid var(--ls-border-strong);
      background: var(--ls-surface-raised);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
      color: var(--ls-text);
      overflow: hidden;
      animation: popIn 120ms ease both;
    }
    .chrome-pop-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex: none;
      padding: 8px 12px 6px;
      border-bottom: 1px solid var(--ls-border);
    }
    .chrome-pop-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ls-text);
    }
    .chrome-pop-count {
      font-size: 10px;
      color: var(--ls-text-faint);
      white-space: nowrap;
    }
    .chrome-pop-menu {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 6px;
    }
    .chrome-pop-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 30px;
      padding: 5px 9px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--ls-text-muted);
      font-family: inherit;
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
      transition: background 100ms, color 100ms;
    }
    .chrome-pop-item:hover:not(:disabled),
    .chrome-pop-item:focus-visible {
      background: rgba(var(--ls-accent-rgb), 0.12);
      color: var(--ls-text);
      outline: none;
    }
    .chrome-pop-item:focus-visible {
      box-shadow: inset 0 0 0 1px rgba(var(--ls-accent-rgb), 0.55);
    }
    .chrome-pop-item:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .chrome-pop-item-two-line {
      align-items: flex-start;
    }
    .chrome-pop-item-static {
      cursor: default;
    }
    .chrome-pop-icon {
      flex: none;
      color: #7c766a;
      margin-top: 1px;
    }
    .chrome-pop-item:hover:not(:disabled) .chrome-pop-icon,
    .chrome-pop-item:focus-visible .chrome-pop-icon {
      color: var(--ls-accent-hover);
    }
    .chrome-pop-main {
      display: flex;
      flex-direction: column;
      gap: 1px;
      flex: 1;
      min-width: 0;
    }
    .chrome-pop-label {
      font-size: 12.5px;
      color: inherit;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chrome-pop-sub {
      font-size: 10px;
      color: var(--ls-text-faint);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chrome-pop-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 6px;
      overflow-y: auto;
      max-height: calc(100vh - 96px);
      scrollbar-width: thin;
      scrollbar-color: var(--ls-border-strong) transparent;
    }
    .chrome-pop-list::-webkit-scrollbar {
      width: 8px;
    }
    .chrome-pop-list::-webkit-scrollbar-thumb {
      border-radius: 4px;
      background: var(--ls-border-strong);
    }
    .chrome-pop-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .chrome-pop-actions {
      display: inline-flex;
      gap: 2px;
      flex: none;
      margin-left: 4px;
    }
    .chrome-pop-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      padding: 0;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--ls-text-faint);
      cursor: pointer;
    }
    .chrome-pop-action:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--ls-text);
    }
    .chrome-pop-action:focus-visible {
      outline: 1px solid rgba(var(--ls-accent-rgb), 0.6);
      outline-offset: 1px;
    }
    .chrome-pop-sep {
      height: 1px;
      margin: 4px 6px;
      background: var(--ls-border);
    }
    .chrome-pop-empty,
    .chrome-pop-error {
      padding: 10px 12px;
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--ls-text-faint);
    }
    .chrome-pop-error {
      color: var(--ls-danger);
      word-break: break-word;
    }
    .chrome-pop-footer {
      flex: none;
      padding: 6px;
      border-top: 1px solid var(--ls-border);
    }
    .chrome-pop-viewmore {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
      height: 28px;
      border: none;
      border-radius: 7px;
      background: rgba(var(--ls-accent-rgb), 0.1);
      color: var(--ls-accent-hover);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 100ms, color 100ms;
    }
    .chrome-pop-viewmore:hover {
      background: rgba(var(--ls-accent-rgb), 0.18);
      color: var(--ls-text);
    }
    .chrome-pop-viewmore:focus-visible {
      outline: 2px solid rgba(var(--ls-accent-rgb), 0.6);
      outline-offset: 1px;
    }
    .chrome-pop-viewmore-icon {
      color: inherit;
    }
    @media (prefers-reduced-motion: reduce) {
      .chrome-pop-card {
        animation: fadeOnly 100ms ease both;
      }
      .chrome-pop-item,
      .chrome-pop-viewmore {
        transition: none;
      }
    }
    html[data-animations="off"] .chrome-pop-card {
      animation: none !important;
    }
    html[data-animations="off"] .chrome-pop-item,
    html[data-animations="off"] .chrome-pop-more {
      transition: none !important;
    }
        /* ══════════════════════════════════════════════════════════════════
         soft 主题：无框化 / 大圆角 / 柔和 hover / 统一缓动
         —— 统一前缀 html:not([data-theme="classic"])，旧观感(classic)完全不变
         ══════════════════════════════════════════════════════════════════ */

      /* 1) 容器/卡片：去 1px 硬边，改用阴影 + 明度分层 */
      html:not([data-theme="classic"]) .settings-panel,
      html:not([data-theme="classic"]) .snapshot-panel,
      html:not([data-theme="classic"]) .onboarding-panel,
      html:not([data-theme="classic"]) .ask-dialog,
      html:not([data-theme="classic"]) .product-card,
      html:not([data-theme="classic"]) .product-panel,
      html:not([data-theme="classic"]) .panel-card,
      html:not([data-theme="classic"]) .plan-card,
      html:not([data-theme="classic"]) .steer-card,
      html:not([data-theme="classic"]) .ref-panel,
      html:not([data-theme="classic"]) .loop-picker {
        border-color: var(--ls-border);
        border-radius: var(--ls-radius-lg);
        box-shadow: var(--ls-shadow-card);
      }

      /* 2) 按钮/条目：大圆角 + hover 只换背景不位移（active 轻微 scale） */
      html:not([data-theme="classic"]) .icon-btn,
      html:not([data-theme="classic"]) .btn,
      html:not([data-theme="classic"]) .btn-ghost,
      html:not([data-theme="classic"]) .btn-primary,
      html:not([data-theme="classic"]) .terminal-action,
      html:not([data-theme="classic"]) .terminal-profile,
      html:not([data-theme="classic"]) .terminal-tab,
      html:not([data-theme="classic"]) .terminal-raw-toggle,
      html:not([data-theme="classic"]) .terminal-send,
      html:not([data-theme="classic"]) .terminal-empty-btn,
      html:not([data-theme="classic"]) .snapshot-btn,
      html:not([data-theme="classic"]) .settings-nav-item,
      html:not([data-theme="classic"]) .command-item,
      html:not([data-theme="classic"]) .browser-more-item,
      html:not([data-theme="classic"]) .chrome-pop-item,
      html:not([data-theme="classic"]) .chrome-pop-action,
      html:not([data-theme="classic"]) .msg-action,
      html:not([data-theme="classic"]) .jump-latest {
        border-radius: var(--ls-radius-sm);
        transition: background-color var(--ls-dur-fast) ease-out, border-color var(--ls-dur-fast) ease-out, color var(--ls-dur-fast) ease-out, box-shadow var(--ls-dur-fast) ease-out;
      }
      html:not([data-theme="classic"]) .chip,
      html:not([data-theme="classic"]) .bookmark-count,
      html:not([data-theme="classic"]) .terminal-tab-dot,
      html:not([data-theme="classic"]) .terminal-profile,
      html:not([data-theme="classic"]) .live-dot,
      html:not([data-theme="classic"]) .browser-more-dot {
        border-radius: 999px;
      }
      html:not([data-theme="classic"]) .btn-primary:hover:not(:disabled),
      html:not([data-theme="classic"]) .btn-ghost:hover:not(:disabled) {
        transform: none;
      }
      html:not([data-theme="classic"]) .icon-btn:active:not(:disabled),
      html:not([data-theme="classic"]) .btn-primary:active:not(:disabled),
      html:not([data-theme="classic"]) .btn-ghost:active:not(:disabled) {
        transform: scale(0.98);
      }

      /* 3) 输入/命令：圆角 + 低对比底 */
      html:not([data-theme="classic"]) .terminal-command-input,
      html:not([data-theme="classic"]) .ask-input {
        border-radius: var(--ls-radius-sm);
      }

      /* 4) 工具条/分隔线：降为极低对比，不再用硬边 */
      html:not([data-theme="classic"]) .terminal-toolbar,
      html:not([data-theme="classic"]) .terminal-tabbar,
      html:not([data-theme="classic"]) .terminal-command,
      html:not([data-theme="classic"]) .snapshot-head,
      html:not([data-theme="classic"]) .ask-head,
      html:not([data-theme="classic"]) .msg-body-divider,
      html:not([data-theme="classic"]) .chrome-pop-head,
      html:not([data-theme="classic"]) .chrome-pop-footer,
      html:not([data-theme="classic"]) .browser-more-sep,
      html:not([data-theme="classic"]) .chrome-pop-sep {
        border-color: var(--ls-border);
      }

      /* 5) 侧栏三态 hook（结构由 AgentSidebar 任务加类名）
            · docked 默认；collapsed 宽 48px；float 已改为独立系统窗口（本文件不再有浮窗样式）
            · 宽度动画全部交给外层 wrapper（App.tsx：width/padding 320ms 同曲线）； */
      .agent-sidebar {
        transition: opacity var(--ls-dur-sidebar) var(--ls-ease),
          border-radius var(--ls-dur-sidebar) var(--ls-ease),
          box-shadow var(--ls-dur-sidebar) var(--ls-ease);
      }
      html:not([data-theme="classic"]) .agent-sidebar {
        border-color: var(--ls-border);
      }
      /* collapsed 的宽度由外层 wrapper 动画（AgentSidebar 根节点恒为 100% 跟随父级）；
         这里绝不能再写 width:48px !important —— 否则收起瞬间内容被瞬间裁成 48px，动画看不见。 */
      .agent-sidebar[data-mode="collapsed"],
      .agent-sidebar.is-collapsed {
        overflow: hidden;
      }
      .agent-sidebar[data-mode="docked"] {
        margin: 0;
        border-radius: 0;
        box-shadow: none;
      }

      /* 6) 终端面板：顶部圆角 + 240ms 高度过渡；全宽 hook */
      .terminal-panel {
        transition: height var(--ls-dur-terminal) var(--ls-ease),
          border-radius var(--ls-dur-terminal) var(--ls-ease),
          box-shadow var(--ls-dur-terminal) var(--ls-ease);
      }
      html:not([data-theme="classic"]) .terminal-panel {
        border-top-color: var(--ls-border);
        border-radius: var(--ls-radius-lg) var(--ls-radius-lg) 0 0;
        box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.28);
      }
      html:not([data-theme="classic"]) .terminal-panel.is-fullwidth {
        border-radius: 0;
        border-left: none;
        border-right: none;
      }

      /* 7) 减动效：prefers-reduced-motion / 设置里关闭动画 */
      @media (prefers-reduced-motion: reduce) {
        .agent-sidebar,
        .agent-sidebar .agent-sidebar-fade,
        .terminal-panel {
          transition: none !important;
        }
      }
      html[data-animations="off"] .agent-sidebar,
      html[data-animations="off"] .agent-sidebar .agent-sidebar-fade,
      html[data-animations="off"] .terminal-panel {
        transition: none !important;
      }
</style>
  </head>

  </body>
