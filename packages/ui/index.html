<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'"
    />
    <link rel="icon" type="image/png" href="./logo.png" />
    <title>Loopsoar</title>
    <style>
      /* ══════════════════════════════════════════════════════════════════
         主题 token（soft 默认 / classic 旧观感）
         · 组件颜色统一经 theme.ts 的 BRAND → var(--ls-…, fallback)，内联样式自动跟随
         · 切换：html[data-theme="classic"]；applyTheme() 会挂 .theme-switching 触发 200ms 颜色过渡
         ══════════════════════════════════════════════════════════════════ */
      :root {
        /* 表面：3 级明度分层，soft 用近黑蓝灰、低对比（不靠 1px 描边建立层次） */
        --ls-bg: #0a0c10;
        --ls-surface: #101318;
        --ls-surface-raised: #171b22;
        --ls-surface-hover: #21262f;
        /* soft = 真无框：默认描边完全透明，层次只靠明度/阴影；需要边界时用 border-strong */
        --ls-border: rgba(255, 255, 255, 0);
        --ls-border-strong: rgba(255, 255, 255, 0.08);
        --ls-text: #ece9e2;
        --ls-text-muted: #a09b93;
        --ls-text-faint: #6d6862;
        --ls-accent: #d98a4f;
        --ls-accent-hover: #e59a5b;
        --ls-accent-soft: rgba(var(--ls-accent-rgb), 0.14);
        --ls-accent-rgb: 217, 138, 79;
        --ls-teal: #6ee7d0;
        --ls-teal-soft: rgba(var(--ls-teal-rgb), 0.14);
        --ls-teal-rgb: 110, 231, 208;
        --ls-danger: #f87171;
        --ls-danger-soft: rgba(248, 113, 113, 0.14);
        --ls-radius-sm: 10px;
        --ls-radius-md: 14px;
        --ls-radius-lg: 20px;
        --ls-shadow-card: 0 10px 40px rgba(0, 0, 0, 0.45);
        --ls-shadow-float: 0 24px 64px rgba(0, 0, 0, 0.6);
        --ls-ease: cubic-bezier(0.2, 0, 0.2, 1);
        --ls-dur-fast: 120ms;
        --ls-dur-active: 80ms;
        --ls-dur-theme: 200ms;
        --ls-dur-sidebar: 320ms;
        --ls-dur-terminal: 240ms;
        --ls-blur-popover: 14px;
      }
      /* classic：旧观感原值（切回 classic 与旧版本逐像素一致） */
      html[data-theme="classic"] {
        --ls-bg: #111318;
        --ls-surface: #15171c;
        --ls-surface-raised: #17191e;
        --ls-surface-hover: #1e2127;
        --ls-border: #262a31;
        --ls-border-strong: #333842;
        --ls-text: #f4efe6;
        --ls-text-muted: #a8a29a;
        --ls-text-faint: #6f6a63;
        --ls-accent: #c8763c;
        --ls-accent-hover: #d98a4f;
        --ls-accent-soft: rgba(var(--ls-accent-rgb), 0.16);
        --ls-accent-rgb: 200, 118, 60;
        --ls-teal: #5eead4;
        --ls-teal-soft: rgba(var(--ls-teal-rgb), 0.14);
        --ls-teal-rgb: 94, 234, 212;
        --ls-danger: #f87171;
        --ls-danger-soft: rgba(248, 113, 113, 0.14);
        --ls-radius-sm: 7px;
        --ls-radius-md: 10px;
        --ls-radius-lg: 14px;
        --ls-shadow-card: 0 8px 24px rgba(0, 0, 0, 0.35);
        --ls-shadow-float: 0 14px 40px rgba(0, 0, 0, 0.55);
      }

      /* ────────────────────────────────────────────────────────────────
         soft 主题 · 第二轮「真无框」调优（第 6 轮用户反馈：变化不够明显）
         原则：不画线；用明度分层 + 圆角 + 柔和阴影 + 极轻的品牌光晕建立层次。
         classic 下全部不生效（html:not([data-theme="classic"]) 前缀）。
         ──────────────────────────────────────────────────────────────── */
      /* 应用底：极轻的品牌色光晕，避免大面积纯黑发闷 */
      html:not([data-theme="classic"]) #root > div {
        background-image:
          radial-gradient(1100px 520px at 16% -14%, rgba(var(--ls-accent-rgb), 0.07), transparent 62%),
          radial-gradient(900px 520px at 100% -6%, rgba(var(--ls-teal-rgb), 0.045), transparent 58%);
        background-repeat: no-repeat;
      }
      /* 右侧会话栏：与第二行网址工具条同一块「抬高的面」（--ls-surface-raised），
         地址栏胶囊与网页面板则各自内凹/浮起；「独立面板」语义只留给网页区。 */
      html:not([data-theme="classic"]) .agent-sidebar {
        border: none !important;
        background: var(--ls-surface-raised) !important;
        border-radius: 0;
        box-shadow: none;
      }
      html:not([data-theme="classic"]) .agent-sidebar.is-collapsed,
      html:not([data-theme="classic"]) .agent-sidebar.is-float {
        border-radius: 0 !important;
        box-shadow: none !important;
      }
      /* 头部 / 工作区 / 会话条：内部不再画任何分隔线 */
      html:not([data-theme="classic"]) .agent-sidebar-header,
      html:not([data-theme="classic"]) .agent-sidebar-workspace,
      html:not([data-theme="classic"]) .agent-sidebar-sessionbar {
        border: none !important;
        border-bottom: none !important;
        background: transparent !important;
      }
      /* chip / 小徽标：默认无边框、hover 才浮出底色 */
      html:not([data-theme="classic"]) .chip {
        border-color: transparent !important;
        background: rgba(255, 255, 255, 0.035);
      }
      html:not([data-theme="classic"]) .chip:hover {
        background: rgba(255, 255, 255, 0.07);
        border-color: transparent !important;
      }
      /* 输入区：一体化浮起面（去框、圆角更大、focus 时才出现品牌描边） */
      html:not([data-theme="classic"]) textarea,
      html:not([data-theme="classic"]) input[type="text"],
      html:not([data-theme="classic"]) input[type="search"] {
        border-color: transparent !important;
      }
      html:not([data-theme="classic"]) textarea:focus,
      html:not([data-theme="classic"]) input:focus {
        border-color: rgba(var(--ls-accent-rgb), 0.55) !important;
        outline: none !important;
      }
      /* 聊天：分隔线更淡；消息块留白更松（阅读更安静） */
      html:not([data-theme="classic"]) .msg-body-divider {
        background: rgba(255, 255, 255, 0.05) !important;
      }
      html:not([data-theme="classic"]) .msg-row {
        padding-top: 2px;
        padding-bottom: 2px;
      }
      /* 注意：不要在这里给 .chat-scroll 设 scrollbar-width:thin —— 会覆盖基础规则的 none，
         原生滚动条和上下箭头按钮会重新出现，与右侧 TopicRail 的波纹卷轴叠在一起。
         聊天区只保留波浪卷轴，原生滚动条保持隐藏。 */
      /* 终端面板（全宽底部）：浮起的大圆角面板 + 顶部柔和阴影 */
      html:not([data-theme="classic"]) .terminal-panel.is-fullwidth {
        border-top: none !important;
        border-radius: var(--ls-radius-lg) var(--ls-radius-lg) 0 0 !important;
        background: var(--ls-surface) !important;
        box-shadow: 0 -16px 48px rgba(0, 0, 0, 0.4);
      }
      /* 状态栏：无分隔线，文字/状态轻量 */
      html:not([data-theme="classic"]) .live-dot {
        box-shadow: 0 0 8px rgba(var(--ls-teal-rgb), 0.55);
      }
      /* ── 真·小窗化：独立 Agent 窗口（?mini=1）──
         该窗口只渲染会话栏，无浏览器工具条/状态栏；会话栏铺满整窗并保留主题。 */
      html[data-mini],
      html[data-mini] body,
      html[data-mini] #root {
        background: var(--ls-bg);
      }
      html[data-mini] .agent-sidebar,
      html[data-mini] .agent-sidebar[data-mode="docked"] {
        width: 100% !important;
        height: 100%;
        margin: 0 !important;
        border: none !important;
        border-radius: var(--ls-radius-md, 12px) !important;
        box-shadow: none !important;
        background: var(--ls-surface) !important;
      }
      html[data-mini] .agent-sidebar .agent-sidebar-inner {
        border-radius: var(--ls-radius-md, 12px);
      }

      /* 主题切换：只做颜色过渡（200ms，无位移）；reduced-motion 下直接切换 */
      html.theme-switching,
      html.theme-switching *,
      html.theme-switching *::before,
      html.theme-switching *::after {
        transition:
          background-color var(--ls-dur-theme, 200ms) ease-out,
          border-color var(--ls-dur-theme, 200ms) ease-out,
          color var(--ls-dur-theme, 200ms) ease-out,
          fill var(--ls-dur-theme, 200ms) ease-out,
          stroke var(--ls-dur-theme, 200ms) ease-out,
          box-shadow var(--ls-dur-theme, 200ms) ease-out !important;
        transition-delay: 0ms !important;
      }
      @media (prefers-reduced-motion: reduce) {
        html.theme-switching,
        html.theme-switching *,
        html.theme-switching *::before,
        html.theme-switching *::after {
          transition: none !important;
        }
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--ls-bg);
        color: var(--ls-text);
      }
      #root {
        height: 100vh;
      }

      /* ── 图标（mask 染色）：SVG 只作形状，颜色跟随当前文字色，主题切换零成本 ── */
      .icon {
        display: inline-block;
        flex: none;
        background-color: currentColor;
        -webkit-mask: var(--icon) center / contain no-repeat;
        mask: var(--icon) center / contain no-repeat;
      }

      /* ── 通用交互态（借鉴 slime：hover 上浮 1px + 软阴影，active 按下回弹） ── */
      .btn-primary {
        transition: background 120ms, color 120ms, transform 80ms, box-shadow 120ms;
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--ls-accent-hover);
        transform: translateY(-1px);
        box-shadow: 0 2px 10px rgba(var(--ls-accent-rgb), 0.28);
      }
      .btn-primary:active:not(:disabled) {
        transform: translateY(0) scale(0.97);
        box-shadow: none;
      }
      .btn-primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .btn-ghost {
        transition: border-color 120ms, color 120ms, background 120ms, transform 80ms;
      }
      .btn-ghost:hover:not(:disabled) {
        border-color: var(--ls-accent);
        color: var(--ls-text);
        background: rgba(var(--ls-accent-rgb), 0.1);
        transform: translateY(-1px);
      }
      .btn-ghost:active:not(:disabled) {
        transform: translateY(0) scale(0.97);
      }
      .btn-ghost:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* 图标按钮：清脆的按下反馈（scale .88 借鉴 slime 的 titlebar-btn） */
      .icon-btn {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--ls-text-muted);
        cursor: pointer;
        transition: background 120ms, color 120ms, transform 80ms;
      }
      .icon-btn:hover:not(:disabled) {
        background: var(--ls-surface-hover);
        color: var(--ls-text);
      }
      .icon-btn:active:not(:disabled) {
        transform: scale(0.88);
      }
      .icon-btn:disabled {
        opacity: 0.32;
        cursor: default;
      }

      /* 键盘可达性：焦点环（鼠标点击不触发） */
      .icon-btn:focus-visible,
      .btn-primary:focus-visible,
      .btn-ghost:focus-visible,
      .win-btn:focus-visible,
      textarea:focus-visible,
      input:focus-visible {
        outline: 2px solid rgba(var(--ls-accent-rgb), 0.6);
        outline-offset: 2px;
      }

      .win-btn {
        background: transparent;
        color: var(--ls-text-muted);
        transition: background-color 120ms ease, color 120ms ease, transform 80ms;
      }
      .win-btn:hover {
        background: var(--ls-surface-hover);
        color: var(--ls-text);
      }
      .win-btn:active {
        transform: scale(0.9);
      }
      .win-close:hover {
        background: #c42b1c;
        color: #ffffff;
      }

      /* 顶行标签页（Chrome 式）：非活动透明、无描边；活动填充工具条同色并高亮文字。
         旧实现的活动标签带 1px 描边，被用户反馈「顶着白框、很杂乱」。 */
      .tab-item {
        border: none;
        background: transparent;
        color: var(--ls-text-muted);
        transition: background-color 120ms ease, color 120ms ease;
      }
      .tab-item:hover:not(.is-active) {
        background: var(--ls-surface-hover);
        color: var(--ls-text);
      }
      .tab-item.is-active {
        background: var(--ls-surface-raised);
        color: var(--ls-text);
        font-weight: 600;
      }
      /* 关闭键：只在悬停当前标签时出现（预留宽度，不引起布局跳动） */
      .tab-item .tab-close {
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms ease, background-color 120ms ease;
      }
      .tab-item:hover .tab-close {
        opacity: 1;
        pointer-events: auto;
      }
      /* 会话栏收起/展开开关：两态共用的星标方块。宽度由内联控制（32↔62），
         底色/文字在这里定义，hover 才有反馈（内联 background 会压过 hover 规则）。 */
      .sidebar-toggle {
        background: var(--ls-accent-soft);
        color: var(--ls-accent-hover);
        transition: background-color 120ms ease, color 120ms ease, width 320ms cubic-bezier(0.2, 0, 0.2, 1);
      }
      .sidebar-toggle:hover {
        background: rgba(var(--ls-accent-rgb), 0.28);
        color: var(--ls-text);
      }
      .sidebar-toggle:active {
        transform: scale(0.96);
      }
      .sidebar-toggle:focus-visible {
        outline: 2px solid rgba(var(--ls-accent-rgb), 0.6);
        outline-offset: 2px;
      }
      /* chip 的内联 background:transparent 会压过普通 :hover 规则，这里用 !important 拿回反馈 */
      .agent-sidebar .chip:hover {
        background: var(--ls-surface-hover) !important;
        color: var(--ls-text);
      }
      .agent-sidebar .model-item:hover {
        background: var(--ls-surface-hover);
        color: var(--ls-text);
      }

      /* ── 动画（全部可在 prefers-reduced-motion 下降级） ── */
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .spinner {
        animation: spin 1s linear infinite;
      }

      /* 流式光标：闪烁块（blink 借鉴 slime 的思考/吐字光标） */
      @keyframes blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }
      .stream-caret {
        display: inline-block;
        width: 7px;
        height: 13px;
        margin-left: 2px;
        vertical-align: -2px;
        border-radius: 1px;
        background: var(--ls-accent);
        animation: blink 1s step-end infinite;
      }

      /* 流式吐字「逐单元渐入」：由右到左 + 由浅到深。
         位移用 relative/left 而非 transform —— 内联元素上 transform 会被静默忽略
         （slime 踩过的坑，这里直接按正确写法实现）。 */
      @keyframes streamUnitIn {
        from {
          opacity: 0;
          left: 3px;
        }
        to {
          opacity: 1;
          left: 0;
        }
      }
      .stream-tail {
        position: relative;
        animation: streamUnitIn 260ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
      }

      /* 新消息行淡入（只做淡入，不做大幅位移：浮层/列表不加"进场"动画避免抽搐） */
      @keyframes fadeOnly {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .msg-enter {
        animation: fadeUp 180ms ease-out both;
      }

      /* 状态点脉冲（在线/思考中） */
      @keyframes pulseDot {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.45;
          transform: scale(0.78);
        }
      }
      .live-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ls-accent);
        animation: pulseDot 2.4s ease-in-out infinite;
      }

      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .toast {
        animation: toastIn 180ms ease-out both;
      }

      textarea:focus,
      input:focus {
        border-color: var(--ls-text-faint);
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a2d36;
        border-radius: 6px;
        border: 2px solid var(--ls-bg);
        transition: background 120ms;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3a3e48;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* 设置面板：左侧导航选中态（细条 + 背景） */
      .settings-nav-item:hover {
        background: var(--ls-surface-hover);
        color: var(--ls-text);
      }
      .settings-nav-item.is-active {
        box-shadow: inset 2px 0 0 var(--ls-accent);
      }
      .settings-seg:hover:not(.is-active) {
        background: var(--ls-surface-hover);
        color: var(--ls-text);
      }
      .settings-toggle:hover {
        border-color: var(--ls-accent);
      }
      /* 输入区能力条（Loopsoar 自有风格：Claude 式圆角容器 + 品牌赭石强调） */
      /* 分区过渡：切换设置页时的轻量入场（不打断阅读，仅位移 4px） */
      @keyframes sectionIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes popIn {
        from { opacity: 0; transform: translateY(-4px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .settings-section {
        animation: sectionIn 180ms ease both;
      }
      .pop-in {
        animation: popIn 120ms ease both;
        transform-origin: top center;
      }
      .panel-card {
        transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
      }
      .panel-card:hover {
        border-color: #3a4150;
        background: #1a1d23;
        transform: translateY(-1px);
      }
      html[data-animations="off"] .settings-section,
      html[data-animations="off"] .pop-in {
        animation: none;
      }
      html[data-animations="reduced"] .settings-section,
      html[data-animations="reduced"] .pop-in {
        animation: fadeOnly 120ms ease both;
      }
      .add-card:hover {
        border-color: var(--ls-accent);
        color: var(--ls-text);
      }
      .chip {
        transition: border-color 120ms, color 120ms, background 120ms, transform 80ms;
      }
      .chip:hover {
        border-color: var(--ls-accent);
        color: var(--ls-text);
      }
      .chip:active {
        transform: scale(0.97);
      }
      .perm-seg {
        transition: background 120ms, color 120ms;
      }
      .perm-seg:hover {
        color: var(--ls-text);
      }
      .send-btn {
        transition: transform 80ms, background 120ms;
      }
      .send-btn:hover:not(:disabled) {
        background: var(--ls-accent-hover);
        transform: scale(1.06);
      }
      .send-btn:active:not(:disabled) {
        transform: scale(0.92);
      }
      .send-btn:disabled {
        cursor: default;
      }
      /* 输入框聚焦时容器描边（容器状态由 :focus-within 表达） */
      div:has(> textarea:focus) {
        border-color: var(--ls-text-faint);
      }

      /* 动效强度偏好（设置 · 通用）：写到 documentElement[data-animations] */
      html[data-animations="reduced"] * {
        animation-duration: 120ms !important;
        transition-duration: 80ms !important;
      }
      html[data-animations="off"] * {
        animation: none !important;
        transition: none !important;
      }

      /* 减动效：去掉一切位移/缩放，但保留不透明度渐入
         （slime 的教训：整块 animation:none 会让用户"什么都看不到"） */
      @media (prefers-reduced-motion: reduce) {
        .icon-btn:active:not(:disabled),
        .btn-primary:active:not(:disabled),
        .btn-ghost:active:not(:disabled),
        .win-btn:active,
        .btn-primary:hover:not(:disabled),
        .btn-ghost:hover:not(:disabled) {
          transform: none;
        }
        .msg-enter,
        .toast {
          animation: fadeOnly 140ms ease both;
        }
        .stream-tail {
          animation: fadeOnly 140ms ease both;
        }
        .spinner,
        .live-dot,
        .stream-caret {
          animation-duration: 2s;
        }
      }
  
    /* ── slime 风格：会话 UI 动效与思考时间线 ── */
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes streamDotJump {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    @keyframes textScan {
      0% { background-position: 200% 50%; }
      100% { background-position: -200% 50%; }
    }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(10px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes breatheGlow {
      0%, 100% { box-shadow: 0 0 0 3px rgba(var(--ls-accent-rgb), 0.12); }
      50% { box-shadow: 0 0 0 5px rgba(var(--ls-accent-rgb), 0.26); }
    }
    .msg-row { user-select: text; animation: msgIn 180ms cubic-bezier(0.2, 0.8, 0.2, 1); }
    .msg-row:hover .msg-hover { opacity: 1; }
    .msg-hover { opacity: 0; transition: opacity 120ms ease; }
    .msg-action {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; padding: 0; border: none; border-radius: 4px;
      background: transparent; color: inherit; cursor: pointer;
      transition: background 120ms, color 120ms, transform 80ms;
    }
    .msg-action:hover { background: rgba(255, 255, 255, 0.08); color: var(--ls-accent-hover); }
    .msg-action:active { transform: scale(0.9); }
    .stream-dot-row { display: inline-flex; gap: 3px; align-items: center; }
    .stream-dot {
      display: inline-block; width: 4px; height: 4px; border-radius: 50%;
      background: currentColor; animation: streamDotJump 1.2s ease-in-out infinite;
      will-change: transform, opacity;
    }
    .text-scan-light {
      background: linear-gradient(90deg, currentColor 0%, #f2d9c2 50%, currentColor 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textScan 2.2s linear infinite;
    }
    .think-timeline { animation: fadeIn 160ms ease; }
    .think-step { position: relative; margin: 2px 0 7px; animation: fadeIn 160ms ease; }
    .think-step-mark {
      position: absolute; left: -19px; top: 7px; width: 8px; height: 8px;
      border-radius: 50%; background: var(--ls-accent);
      box-shadow: 0 0 0 3px rgba(var(--ls-accent-rgb), 0.14);
    }
    .think-timeline.is-live .think-step-mark { animation: breatheGlow 1.8s ease-in-out infinite; }
    .think-step-mark[data-state="error"] { background: var(--ls-danger); box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.18); }
    .think-step-toggle {
      display: inline-flex; align-items: center; gap: 6px; width: 100%; max-width: 100%; white-space: nowrap;
      padding: 0; border: none; background: transparent; cursor: pointer;
      color: #c9c3b6; font-size: 12px; font-weight: 600;
      transition: color 120ms;
    }
    .think-step-toggle:hover { color: var(--ls-accent-hover); }
    .think-step-preview {
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-weight: 400; font-size: 11.5px; color: #7c766a;
    }
    .think-step-text {
      margin-top: 4px; padding: 2px 4px 2px 10px;
      border-left: 2px solid #2c2c31;
      font-size: 12px; line-height: 1.7; color: #a8a296;
      max-height: 320px; overflow-y: auto; overscroll-behavior: contain;
      word-break: break-word;
      animation: fadeIn 160ms ease;
    }
    .think-step-state {
      font-size: 10px; padding: 0 5px; border-radius: 999px;
      border: 1px solid #2c2c31; color: #7c766a;
    }
    .panel-card { animation: panelIn 180ms cubic-bezier(0.2, 0.9, 0.2, 1); }
    .pop-in { transform-origin: bottom right; }
    .settings-overlay { animation: backdropIn 160ms ease; }
    .settings-panel { animation: panelIn 220ms cubic-bezier(0.2, 0.9, 0.2, 1); }
    .chip, .icon-btn, .btn, .settings-nav-item {
      transition: background 140ms ease, color 140ms ease, border-color 140ms ease,
        transform 90ms ease, box-shadow 140ms ease;
    }
    .chip:active, .icon-btn:active, .btn:active { transform: scale(0.96); }
    html[data-animations="off"] .msg-row,
    html[data-animations="off"] .think-step,
    html[data-animations="off"] .think-step-text,
    html[data-animations="off"] .settings-overlay,
    html[data-animations="off"] .settings-panel,
    html[data-animations="off"] .pop-in,
    html[data-animations="off"] .stream-dot,
    html[data-animations="off"] .text-scan-light { animation: none !important; }
    /* ── 卷轴：隐藏原生滚动条，右侧由 canvas 卷轴代替 ── */
    .chat-scroll { scrollbar-width: none; scrollbar-gutter: auto; }
    .chat-scroll::-webkit-scrollbar { width: 0; height: 0; }
    /* 卷轴悬停卡片（对齐 slime 的设计）：左侧圆点 + 「n / total」序号 + 话题标签。
       悬浮在卷轴左外侧、跟随鼠标纵向移动；只动 transform，不触发布局。 */
    .topic-rail-tip {
      position: absolute;
      right: 22px;
      top: 0;
      display: none;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      max-width: 300px;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--ls-surface-raised);
      border: 1px solid var(--ls-border);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.5);
      font-size: 12.5px;
      color: var(--ls-text);
      transform: translate3d(0, 0, 0);
      pointer-events: none;
      z-index: 4;
    }
    .topic-rail-tip.on { display: flex; }
    .topic-rail-tip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ls-accent); flex: none; }
    .topic-rail-tip .ord {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: var(--ls-accent);
      opacity: 0.9;
    }
    .topic-rail-tip .txt { overflow: hidden; text-overflow: ellipsis; }

    /* ══════════════════════════════════════════════════════════════════════
       slime 式交错时间线（思考 / 穿插正文 / 工具 / 规划 / 播报 / 引导）
       ══════════════════════════════════════════════════════════════════════ */

    /* 展开 / 收起：内容常驻 + grid 0fr↔1fr 高度插值（不卸载 DOM，才有第二帧可插值） */
    .collapse {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition:
        grid-template-rows 280ms cubic-bezier(0.22, 0.61, 0.36, 1),
        opacity 220ms cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .collapse.is-open { grid-template-rows: 1fr; opacity: 1; }
    .collapse > * {
      min-height: 0;
      overflow: hidden;
      visibility: hidden;
      content-visibility: hidden;
      transition:
        visibility 0s linear 400ms,
        content-visibility 0s linear 400ms;
      transition-behavior: allow-discrete;
    }
    .collapse.is-open > * {
      visibility: visible;
      content-visibility: visible;
      transition:
        visibility 0s linear 0s,
        content-visibility 0s linear 0s;
      transition-behavior: allow-discrete;
    }

    /* 吐字渐入：新单元从右滑入 + 淡入（inline 盒不能用 transform，用 relative+left） */
    @keyframes streamUnitIn {
      from { opacity: 0; left: 3px; }
      to { opacity: 1; left: 0; }
    }
    @keyframes streamUnitFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .stream-fade-unit {
      position: relative;
      animation: streamUnitIn 260ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }
    @media (prefers-reduced-motion: reduce) {
      .stream-fade-unit { animation-name: streamUnitFadeIn; }
    }

    /* 卡片壳 */
    .think-card { margin: 8px 0 2px; }
    .think-card-title {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 2px 0; border: none; background: transparent; cursor: pointer;
      font-size: 12px; font-weight: 700; letter-spacing: 0.3px;
      color: #a8a296; text-align: left;
      transition: color 140ms ease;
    }
    .think-card-title:hover { color: var(--ls-accent-hover); }
    .think-card-brain { color: var(--ls-accent-hover); font-size: 12px; }
    .think-card-count {
      font-size: 10.5px; font-weight: 400; color: #7c766a;
      padding: 0 5px; border-radius: 999px; border: 1px solid #2c2c31;
    }

    /* 轴线 */
    .think-timeline {
      display: flex; flex-direction: column;
      border-left: 2px solid rgba(var(--ls-accent-rgb), 0.18);
      margin: 6px 0 4px 12px;
      padding-left: 14px;
    }
    .think-timeline-inner { display: flex; flex-direction: column; }
    .think-timeline-inner .think-timeline { border-left: none; margin-left: 0; padding-left: 0; }

    /* 工作阶段组 */
    .think-group { margin-bottom: 4px; }
    .think-group-head {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 2px 0; border: none; background: transparent; cursor: pointer;
      color: #a8a296; font-size: 12px; text-align: left;
      transition: color 140ms ease;
    }
    .think-group-head:hover { color: var(--ls-accent-hover); }
    .think-group-head.is-static { cursor: default; color: #7c766a; }
    .think-group-headline {
      font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .think-group-steps {
      margin-left: auto; flex-shrink: 0; font-size: 10.5px; color: #7c766a;
      font-variant-numeric: tabular-nums;
    }

    /* 节点 */
    .think-step { position: relative; margin: 2px 0 7px; animation: fadeIn 160ms ease; }
    .think-step-mark {
      position: absolute; left: -19px; top: 7px; width: 8px; height: 8px;
      border-radius: 50%; background: var(--ls-accent);
      box-shadow: 0 0 0 3px rgba(var(--ls-accent-rgb), 0.14);
      opacity: 0.85;
    }
    .think-timeline.is-live .think-step-mark { animation: breatheGlow 1.8s ease-in-out infinite; }
    .think-step-mark.body-step-mark {
      border-radius: 2px; background: var(--ls-accent-hover);
      box-shadow: 0 0 0 3px rgba(var(--ls-accent-rgb), 0.12);
    }
    .think-step-mark.plan-step-mark, .think-step-mark.steer-step-mark { background: var(--ls-accent-hover); }
    .think-step-mark.todo-step-mark { background: var(--ls-accent-hover); }
    .think-step-mark.todo-step-mark.is-done {
      background: #4ade80; box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.15);
    }

    .think-step-toggle {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 0; border: none; background: transparent; cursor: pointer;
      color: #a8a296; text-align: left;
      transition: color 140ms ease;
    }
    .think-step-toggle:hover { color: var(--ls-accent-hover); }
    .think-step-preview {
      font-size: 12px; line-height: 1.5; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; flex: 1; min-width: 0; color: #a8a296;
    }
    .think-step-text {
      margin-top: 4px; padding: 2px 4px 2px 10px;
      border-left: 2px solid #2c2c31;
      font-size: 12.5px; line-height: 1.75; color: #a8a296;
      max-height: 320px; overflow-y: auto; overscroll-behavior: contain;
      word-break: break-word;
    }
    .think-step-text .md-line, .think-step-text .md-heading { color: inherit; }
    .body-step-text {
      margin: 4px 0 2px; padding: 2px 4px 2px 12px;
      border-left: 2px solid rgba(var(--ls-accent-rgb), 0.5);
      font-size: 13.5px; line-height: 1.75; color: #e6dfd2;
    }

    /* 任务规划卡 */
    .plan-card {
      border: 1px solid rgba(var(--ls-accent-rgb), 0.18);
      background: rgba(var(--ls-accent-rgb), 0.06);
      border-radius: 8px; padding: 5px 8px 5px 7px;
    }
    .plan-card-head {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 0; border: none; background: transparent; cursor: pointer; text-align: left;
    }
    .plan-card-title { font-size: 12px; font-weight: 600; color: #c9c3b6; flex-shrink: 0; }
    .plan-card-progress {
      font-size: 11px; color: var(--ls-accent-hover); flex-shrink: 0; font-variant-numeric: tabular-nums;
    }
    .plan-card-progress[data-all-done="1"] { color: #4ade80; }
    .plan-card-active {
      font-size: 11px; color: #7c766a; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; flex: 1; min-width: 0;
    }
    .plan-card-list {
      margin-top: 4px; max-height: 240px; overflow-y: auto; overscroll-behavior: contain;
    }
    .plan-item {
      display: flex; align-items: flex-start; gap: 6px;
      font-size: 11.5px; line-height: 1.65; padding: 1px 0;
    }
    .plan-item-mark { flex-shrink: 0; width: 12px; text-align: center; font-size: 10px; color: #7c766a; }
    .plan-item-text { flex: 1; min-width: 0; word-break: break-word; color: #a8a296; }
    .plan-item[data-status="in_progress"] .plan-item-text { color: var(--ls-text); font-weight: 500; }
    .plan-item[data-status="in_progress"] .plan-item-mark { color: var(--ls-accent-hover); }
    .plan-item[data-status="completed"] .plan-item-text { color: #7c766a; text-decoration: line-through; }
    .plan-item[data-status="completed"] .plan-item-mark { color: #4ade80; }

    /* 推进播报 + 划掉动画 */
    .todo-announce {
      display: flex; align-items: center; gap: 6px;
      font-size: 11.5px; line-height: 1.6; color: #c9c3b6; min-width: 0;
    }
    .todo-announce-mark {
      flex-shrink: 0; width: 13px; height: 13px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 9px; color: var(--ls-accent-hover); background: rgba(var(--ls-accent-rgb), 0.14);
    }
    .todo-announce.is-done .todo-announce-mark { color: #4ade80; background: rgba(74, 222, 128, 0.16); }
    .todo-announce-text {
      position: relative; flex: 1; min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .todo-announce.is-done .todo-announce-text { color: #7c766a; }
    .todo-announce.is-done .todo-announce-text::after {
      content: ""; position: absolute; left: 0; top: 50%; height: 1px; width: 0;
      background: currentColor; animation: todoAnnounceStrike 360ms ease-out forwards;
    }
    @keyframes todoAnnounceStrike { from { width: 0; } to { width: 100%; } }
    .todo-announce-tag {
      flex-shrink: 0; font-size: 10px; padding: 0 5px; border-radius: 999px;
      color: var(--ls-accent-hover); background: rgba(var(--ls-accent-rgb), 0.12);
    }
    .todo-announce.is-done .todo-announce-tag { color: #4ade80; background: rgba(74, 222, 128, 0.14); }

    /* 引导卡 */
    .steer-card {
      border: 1px solid rgba(var(--ls-accent-rgb), 0.22);
      background: rgba(var(--ls-accent-rgb), 0.09);
      border-left: 2px solid var(--ls-accent-hover);
      border-radius: 8px; padding: 5px 8px 5px 7px; min-width: 0;
    }
    .steer-card-head {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 0; border: none; background: transparent; cursor: pointer; text-align: left;
    }
    .steer-card-title { font-size: 12px; font-weight: 600; color: #c9c3b6; flex-shrink: 0; }
    .steer-card-preview {
      font-size: 11px; color: #7c766a; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; flex: 1; min-width: 0;
    }
    .steer-card-text {
      margin-top: 4px; font-size: 12px; line-height: 1.65; color: var(--ls-text);
      white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow-y: auto;
    }

    /* 工具节点 */
    .think-tool-node { position: relative; margin: 2px 0 7px; animation: fadeIn 160ms ease; }
    .think-tool-mark {
      position: absolute; left: -19px; top: 9px; width: 8px; height: 8px; border-radius: 50%;
      background: #8b93a3;
    }
    .think-tool-btn {
      display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
      background: rgba(var(--ls-accent-rgb), 0.04);
      border: 1px solid rgba(var(--ls-accent-rgb), 0.10);
      border-radius: 7px; padding: 4px 8px;
      font-size: 12px; color: #a8a296; transition: background 150ms ease;
      outline: none;
    }
    .think-tool-btn:hover { background: rgba(var(--ls-accent-rgb), 0.09); }
    .think-tool-btn[data-status="ok"] {
      border-left: 4px solid #4ade80; padding-left: 7px;
    }
    .think-tool-btn[data-status="fail"] {
      border-left: 4px solid var(--ls-danger); padding-left: 7px;
    }
    .think-tool-glyph { flex-shrink: 0; font-size: 11px; opacity: 0.9; }
    .think-tool-name {
      flex-shrink: 0; max-width: 30%; font-weight: 600; color: var(--ls-accent-hover);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .think-tool-cat {
      flex-shrink: 0; font-size: 10px; padding: 1px 5px; border-radius: 7px;
      line-height: 1.4; background: #1a1d24; border: 1px solid #2c2c31; color: #7c766a;
    }
    .think-tool-detail {
      flex: 1 1 auto; min-width: 0; font-size: 11px; color: #7c766a;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .think-tool-detail.is-link { color: var(--ls-accent-hover); text-decoration: underline dotted; cursor: pointer; }
    .think-tool-status {
      flex-shrink: 0; min-width: 3.6em; display: inline-flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 6px;
      background: rgba(255, 255, 255, 0.10);
    }
    .think-tool-status[data-running="1"] {
      position: relative; isolation: isolate; color: var(--ls-accent-hover);
      background-color: transparent; animation: toolStatusBreathe 2.4s ease-in-out infinite;
    }
    .think-tool-status[data-running="1"]::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
      background-color: rgba(var(--ls-accent-rgb), 0.30);
    }
    .think-tool-status[data-settled="1"] { animation: toolStatusSettle 340ms cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes toolStatusBreathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes toolStatusSettle {
      0% { transform: scale(0.86); opacity: 0.35; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .think-tool-chevron {
      flex-shrink: 0; background: transparent; border: none; cursor: pointer;
      padding: 0; display: inline-flex;
    }
    .think-tool-detail-box {
      margin: 4px 0 0 20px; padding: 6px 8px;
      background: rgba(var(--ls-accent-rgb), 0.05); border-radius: 6px;
      font-size: 11px; line-height: 1.6; color: #a8a296; word-break: break-word;
      max-height: 320px; overflow-y: auto; overscroll-behavior: contain;

    .think-tool-detail-line {
      display: flex; align-items: flex-start; gap: 5px; font-size: 11px; line-height: 1.5;
