<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'"
    />
    <link rel="icon" type="image/png" href="./logo.png" />
    <title>Loopsoar</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #111318;
        color: #f4efe6;
      }
      #root {
        height: 100vh;
      }

      /* ── 图标（mask 染色）：SVG 只作形状，颜色跟随当前文字色，主题切换零成本 ── */
      .icon {
        display: inline-block;
        flex: none;
        background-color: currentColor;
        -webkit-mask: var(--icon) center / contain no-repeat;
        mask: var(--icon) center / contain no-repeat;
      }

      /* ── 通用交互态（借鉴 slime：hover 上浮 1px + 软阴影，active 按下回弹） ── */
      .btn-primary {
        transition: background 120ms, color 120ms, transform 80ms, box-shadow 120ms;
      }
      .btn-primary:hover:not(:disabled) {
        background: #d98a4f;
        transform: translateY(-1px);
        box-shadow: 0 2px 10px rgba(200, 118, 60, 0.28);
      }
      .btn-primary:active:not(:disabled) {
        transform: translateY(0) scale(0.97);
        box-shadow: none;
      }
      .btn-primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .btn-ghost {
        transition: border-color 120ms, color 120ms, background 120ms, transform 80ms;
      }
      .btn-ghost:hover:not(:disabled) {
        border-color: #c8763c;
        color: #f4efe6;
        background: rgba(200, 118, 60, 0.1);
        transform: translateY(-1px);
      }
      .btn-ghost:active:not(:disabled) {
        transform: translateY(0) scale(0.97);
      }
      .btn-ghost:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* 图标按钮：清脆的按下反馈（scale .88 借鉴 slime 的 titlebar-btn） */
      .icon-btn {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: #a8a29a;
        cursor: pointer;
        transition: background 120ms, color 120ms, transform 80ms;
      }
      .icon-btn:hover:not(:disabled) {
        background: #1e2127;
        color: #f4efe6;
      }
      .icon-btn:active:not(:disabled) {
        transform: scale(0.88);
      }
      .icon-btn:disabled {
        opacity: 0.32;
        cursor: default;
      }

      /* 键盘可达性：焦点环（鼠标点击不触发） */
      .icon-btn:focus-visible,
      .btn-primary:focus-visible,
      .btn-ghost:focus-visible,
      .win-btn:focus-visible,
      textarea:focus-visible,
      input:focus-visible {
        outline: 2px solid rgba(200, 118, 60, 0.6);
        outline-offset: 2px;
      }

      .win-btn {
        transition: background-color 120ms ease, color 120ms ease, transform 80ms;
      }
      .win-btn:hover {
        background: #1e2127;
        color: #f4efe6;
      }
      .win-btn:active {
        transform: scale(0.9);
      }
      .win-close:hover {
        background: #c42b1c;
        color: #ffffff;
      }

      /* ── 动画（全部可在 prefers-reduced-motion 下降级） ── */
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .spinner {
        animation: spin 1s linear infinite;
      }

      /* 流式光标：闪烁块（blink 借鉴 slime 的思考/吐字光标） */
      @keyframes blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }
      .stream-caret {
        display: inline-block;
        width: 7px;
        height: 13px;
        margin-left: 2px;
        vertical-align: -2px;
        border-radius: 1px;
        background: #c8763c;
        animation: blink 1s step-end infinite;
      }

      /* 流式吐字「逐单元渐入」：由右到左 + 由浅到深。
         位移用 relative/left 而非 transform —— 内联元素上 transform 会被静默忽略
         （slime 踩过的坑，这里直接按正确写法实现）。 */
      @keyframes streamUnitIn {
        from {
          opacity: 0;
          left: 3px;
        }
        to {
          opacity: 1;
          left: 0;
        }
      }
      .stream-tail {
        position: relative;
        animation: streamUnitIn 260ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
      }

      /* 新消息行淡入（只做淡入，不做大幅位移：浮层/列表不加"进场"动画避免抽搐） */
      @keyframes fadeOnly {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .msg-enter {
        animation: fadeUp 180ms ease-out both;
      }

      /* 状态点脉冲（在线/思考中） */
      @keyframes pulseDot {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.45;
          transform: scale(0.78);
        }
      }
      .live-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #c8763c;
        animation: pulseDot 2.4s ease-in-out infinite;
      }

      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .toast {
        animation: toastIn 180ms ease-out both;
      }

      textarea:focus,
      input:focus {
        border-color: #6f6a63;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a2d36;
        border-radius: 6px;
        border: 2px solid #111318;
        transition: background 120ms;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3a3e48;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* 设置面板：左侧导航选中态（细条 + 背景） */
      .settings-nav-item:hover {
        background: #1e2127;
        color: #f4efe6;
      }
      .settings-nav-item.is-active {
        box-shadow: inset 2px 0 0 #c8763c;
      }
      .settings-seg:hover:not(.is-active) {
        background: #1e2127;
        color: #f4efe6;
      }
      .settings-toggle:hover {
        border-color: #c8763c;
      }
      /* 输入区能力条（Loopsoar 自有风格：Claude 式圆角容器 + 品牌赭石强调） */
      /* 分区过渡：切换设置页时的轻量入场（不打断阅读，仅位移 4px） */
      @keyframes sectionIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes popIn {
        from { opacity: 0; transform: translateY(-4px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .settings-section {
        animation: sectionIn 180ms ease both;
      }
      .pop-in {
        animation: popIn 120ms ease both;
        transform-origin: top center;
      }
      .panel-card {
        transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
      }
      .panel-card:hover {
        border-color: #3a4150;
        background: #1a1d23;
        transform: translateY(-1px);
      }
      html[data-animations="off"] .settings-section,
      html[data-animations="off"] .pop-in {
        animation: none;
      }
      html[data-animations="reduced"] .settings-section,
      html[data-animations="reduced"] .pop-in {
        animation: fadeOnly 120ms ease both;
      }
      .add-card:hover {
        border-color: #c8763c;
        color: #f4efe6;
      }
      .chip {
        transition: border-color 120ms, color 120ms, background 120ms, transform 80ms;
      }
      .chip:hover {
        border-color: #c8763c;
        color: #f4efe6;
      }
      .chip:active {
        transform: scale(0.97);
      }
      .perm-seg {
        transition: background 120ms, color 120ms;
      }
      .perm-seg:hover {
        color: #f4efe6;
      }
      .send-btn {
        transition: transform 80ms, background 120ms;
      }
      .send-btn:hover:not(:disabled) {
        background: #d98a4f;
        transform: scale(1.06);
      }
      .send-btn:active:not(:disabled) {
        transform: scale(0.92);
      }
      .send-btn:disabled {
        cursor: default;
      }
      /* 输入框聚焦时容器描边（容器状态由 :focus-within 表达） */
      div:has(> textarea:focus) {
        border-color: #6f6a63;
      }

      /* 动效强度偏好（设置 · 通用）：写到 documentElement[data-animations] */
      html[data-animations="reduced"] * {
        animation-duration: 120ms !important;
        transition-duration: 80ms !important;
      }
      html[data-animations="off"] * {
        animation: none !important;
        transition: none !important;
      }

      /* 减动效：去掉一切位移/缩放，但保留不透明度渐入
         （slime 的教训：整块 animation:none 会让用户"什么都看不到"） */
      @media (prefers-reduced-motion: reduce) {
        .icon-btn:active:not(:disabled),
        .btn-primary:active:not(:disabled),
        .btn-ghost:active:not(:disabled),
        .win-btn:active,
        .btn-primary:hover:not(:disabled),
        .btn-ghost:hover:not(:disabled) {
          transform: none;
        }
        .msg-enter,
        .toast {
          animation: fadeOnly 140ms ease both;
        }
        .stream-tail {
          animation: fadeOnly 140ms ease both;
        }
        .spinner,
        .live-dot,
        .stream-caret {
          animation-duration: 2s;
        }
      }
  
    /* ── slime 风格：会话 UI 动效与思考时间线 ── */
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes streamDotJump {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    @keyframes textScan {
      0% { background-position: 200% 50%; }
      100% { background-position: -200% 50%; }
    }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(10px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes breatheGlow {
      0%, 100% { box-shadow: 0 0 0 3px rgba(200, 118, 60, 0.12); }
      50% { box-shadow: 0 0 0 5px rgba(200, 118, 60, 0.26); }
    }
    .msg-row { user-select: text; animation: msgIn 180ms cubic-bezier(0.2, 0.8, 0.2, 1); }
    .msg-row:hover .msg-hover { opacity: 1; }
    .msg-hover { opacity: 0; transition: opacity 120ms ease; }
    .msg-action {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; padding: 0; border: none; border-radius: 4px;
      background: transparent; color: inherit; cursor: pointer;
      transition: background 120ms, color 120ms, transform 80ms;
    }
    .msg-action:hover { background: rgba(255, 255, 255, 0.08); color: #d98a4f; }
    .msg-action:active { transform: scale(0.9); }
    .stream-dot-row { display: inline-flex; gap: 3px; align-items: center; }
    .stream-dot {
      display: inline-block; width: 4px; height: 4px; border-radius: 50%;
      background: currentColor; animation: streamDotJump 1.2s ease-in-out infinite;
      will-change: transform, opacity;
    }
    .text-scan-light {
      background: linear-gradient(90deg, currentColor 0%, #f2d9c2 50%, currentColor 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textScan 2.2s linear infinite;
    }
    .think-timeline { animation: fadeIn 160ms ease; }
    .think-step { position: relative; margin: 2px 0 7px; animation: fadeIn 160ms ease; }
    .think-step-mark {
      position: absolute; left: -19px; top: 7px; width: 8px; height: 8px;
      border-radius: 50%; background: #c8763c;
      box-shadow: 0 0 0 3px rgba(200, 118, 60, 0.14);
    }
    .think-timeline.is-live .think-step-mark { animation: breatheGlow 1.8s ease-in-out infinite; }
    .think-step-mark[data-state="error"] { background: #f87171; box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.18); }
    .think-step-toggle {
      display: inline-flex; align-items: center; gap: 6px; width: 100%; max-width: 100%; white-space: nowrap;
      padding: 0; border: none; background: transparent; cursor: pointer;
      color: #c9c3b6; font-size: 12px; font-weight: 600;
      transition: color 120ms;
    }
    .think-step-toggle:hover { color: #d98a4f; }
    .think-step-preview {
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-weight: 400; font-size: 11.5px; color: #7c766a;
    }
    .think-step-text {
      margin-top: 4px; padding: 2px 4px 2px 10px;
      border-left: 2px solid #2c2c31;
      font-size: 12px; line-height: 1.7; color: #a8a296;
      max-height: 320px; overflow-y: auto; overscroll-behavior: contain;
      word-break: break-word;
      animation: fadeIn 160ms ease;
    }
    .think-step-state {
      font-size: 10px; padding: 0 5px; border-radius: 999px;
      border: 1px solid #2c2c31; color: #7c766a;
    }
    .panel-card { animation: panelIn 180ms cubic-bezier(0.2, 0.9, 0.2, 1); }
    .pop-in { transform-origin: bottom right; }
    .settings-overlay { animation: backdropIn 160ms ease; }
    .settings-panel { animation: panelIn 220ms cubic-bezier(0.2, 0.9, 0.2, 1); }
    .chip, .icon-btn, .btn, .settings-nav-item {
      transition: background 140ms ease, color 140ms ease, border-color 140ms ease,
        transform 90ms ease, box-shadow 140ms ease;
    }
    .chip:active, .icon-btn:active, .btn:active { transform: scale(0.96); }
    html[data-animations="off"] .msg-row,
    html[data-animations="off"] .think-step,
    html[data-animations="off"] .think-step-text,
    html[data-animations="off"] .settings-overlay,
    html[data-animations="off"] .settings-panel,
    html[data-animations="off"] .pop-in,
    html[data-animations="off"] .stream-dot,
    html[data-animations="off"] .text-scan-light { animation: none !important; }
    /* ── 卷轴：隐藏原生滚动条，右侧由 canvas 卷轴代替 ── */
    .chat-scroll { scrollbar-width: none; scrollbar-gutter: auto; }
    .chat-scroll::-webkit-scrollbar { width: 0; height: 0; }
    .topic-rail-tip {
      position: absolute;
      right: calc(100% + 10px);
      top: 0;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(17, 19, 24, 0.94);
      border: 1px solid #2c2c31;
      color: #c9c3b6;
      font-size: 11px;
      line-height: 1.4;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(0);
      transition: opacity 120ms ease;
      pointer-events: none;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .topic-rail-tip.on { opacity: 1; }

    /* ══════════════════════════════════════════════════════════════════════
       slime 式交错时间线（思考 / 穿插正文 / 工具 / 规划 / 播报 / 引导）
       ══════════════════════════════════════════════════════════════════════ */

    /* 展开 / 收起：内容常驻 + grid 0fr↔1fr 高度插值（不卸载 DOM，才有第二帧可插值） */
    .collapse {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition:
        grid-template-rows 280ms cubic-bezier(0.22, 0.61, 0.36, 1),
        opacity 220ms cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .collapse.is-open { grid-template-rows: 1fr; opacity: 1; }
    .collapse > * {
      min-height: 0;
      overflow: hidden;
      visibility: hidden;
      content-visibility: hidden;
      transition:
        visibility 0s linear 400ms,
        content-visibility 0s linear 400ms;
      transition-behavior: allow-discrete;
    }
    .collapse.is-open > * {
      visibility: visible;
      content-visibility: visible;
      transition:
        visibility 0s linear 0s,
        content-visibility 0s linear 0s;
      transition-behavior: allow-discrete;
    }

    /* 吐字渐入：新单元从右滑入 + 淡入（inline 盒不能用 transform，用 relative+left） */
    @keyframes streamUnitIn {
      from { opacity: 0; left: 3px; }
      to { opacity: 1; left: 0; }
    }
    @keyframes streamUnitFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .stream-fade-unit {
      position: relative;
      animation: streamUnitIn 260ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }
    @media (prefers-reduced-motion: reduce) {
      .stream-fade-unit { animation-name: streamUnitFadeIn; }
    }

    /* 卡片壳 */
    .think-card { margin: 8px 0 2px; }
    .think-card-title {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 2px 0; border: none; background: transparent; cursor: pointer;
      font-size: 12px; font-weight: 700; letter-spacing: 0.3px;
      color: #a8a296; text-align: left;
      transition: color 140ms ease;
    }
    .think-card-title:hover { color: #d98a4f; }
    .think-card-brain { color: #d98a4f; font-size: 12px; }
    .think-card-count {
      font-size: 10.5px; font-weight: 400; color: #7c766a;
      padding: 0 5px; border-radius: 999px; border: 1px solid #2c2c31;
    }

    /* 轴线 */
    .think-timeline {
      display: flex; flex-direction: column;
      border-left: 2px solid rgba(200, 118, 60, 0.18);
      margin: 6px 0 4px 12px;
      padding-left: 14px;
    }
    .think-timeline-inner { display: flex; flex-direction: column; }
    .think-timeline-inner .think-timeline { border-left: none; margin-left: 0; padding-left: 0; }

    /* 工作阶段组 */
    .think-group { margin-bottom: 4px; }
    .think-group-head {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 2px 0; border: none; background: transparent; cursor: pointer;
      color: #a8a296; font-size: 12px; text-align: left;
      transition: color 140ms ease;
    }
    .think-group-head:hover { color: #d98a4f; }
    .think-group-head.is-static { cursor: default; color: #7c766a; }
    .think-group-headline {
      font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .think-group-steps {
      margin-left: auto; flex-shrink: 0; font-size: 10.5px; color: #7c766a;
      font-variant-numeric: tabular-nums;
    }

    /* 节点 */
    .think-step { position: relative; margin: 2px 0 7px; animation: fadeIn 160ms ease; }
    .think-step-mark {
      position: absolute; left: -19px; top: 7px; width: 8px; height: 8px;
      border-radius: 50%; background: #c8763c;
      box-shadow: 0 0 0 3px rgba(200, 118, 60, 0.14);
      opacity: 0.85;
    }
    .think-timeline.is-live .think-step-mark { animation: breatheGlow 1.8s ease-in-out infinite; }
    .think-step-mark.body-step-mark {
      border-radius: 2px; background: #d98a4f;
      box-shadow: 0 0 0 3px rgba(200, 118, 60, 0.12);
    }
    .think-step-mark.plan-step-mark, .think-step-mark.steer-step-mark { background: #d98a4f; }
    .think-step-mark.todo-step-mark { background: #d98a4f; }
    .think-step-mark.todo-step-mark.is-done {
      background: #4ade80; box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.15);
    }

    .think-step-toggle {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 0; border: none; background: transparent; cursor: pointer;
      color: #a8a296; text-align: left;
      transition: color 140ms ease;
    }
    .think-step-toggle:hover { color: #d98a4f; }
    .think-step-preview {
      font-size: 12px; line-height: 1.5; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; flex: 1; min-width: 0; color: #a8a296;
    }
    .think-step-text {
      margin-top: 4px; padding: 2px 4px 2px 10px;
      border-left: 2px solid #2c2c31;
      font-size: 12.5px; line-height: 1.75; color: #a8a296;
      max-height: 320px; overflow-y: auto; overscroll-behavior: contain;
      word-break: break-word;
    }
    .think-step-text .md-line, .think-step-text .md-heading { color: inherit; }
    .body-step-text {
      margin: 4px 0 2px; padding: 2px 4px 2px 12px;
      border-left: 2px solid rgba(200, 118, 60, 0.5);
      font-size: 13.5px; line-height: 1.75; color: #e6dfd2;
    }

    /* 任务规划卡 */
    .plan-card {
      border: 1px solid rgba(200, 118, 60, 0.18);
      background: rgba(200, 118, 60, 0.06);
      border-radius: 8px; padding: 5px 8px 5px 7px;
    }
    .plan-card-head {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 0; border: none; background: transparent; cursor: pointer; text-align: left;
    }
    .plan-card-title { font-size: 12px; font-weight: 600; color: #c9c3b6; flex-shrink: 0; }
    .plan-card-progress {
      font-size: 11px; color: #d98a4f; flex-shrink: 0; font-variant-numeric: tabular-nums;
    }
    .plan-card-progress[data-all-done="1"] { color: #4ade80; }
    .plan-card-active {
      font-size: 11px; color: #7c766a; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; flex: 1; min-width: 0;
    }
    .plan-card-list {
      margin-top: 4px; max-height: 240px; overflow-y: auto; overscroll-behavior: contain;
    }
    .plan-item {
      display: flex; align-items: flex-start; gap: 6px;
      font-size: 11.5px; line-height: 1.65; padding: 1px 0;
    }
    .plan-item-mark { flex-shrink: 0; width: 12px; text-align: center; font-size: 10px; color: #7c766a; }
    .plan-item-text { flex: 1; min-width: 0; word-break: break-word; color: #a8a296; }
    .plan-item[data-status="in_progress"] .plan-item-text { color: #f4efe6; font-weight: 500; }
    .plan-item[data-status="in_progress"] .plan-item-mark { color: #d98a4f; }
    .plan-item[data-status="completed"] .plan-item-text { color: #7c766a; text-decoration: line-through; }
    .plan-item[data-status="completed"] .plan-item-mark { color: #4ade80; }

    /* 推进播报 + 划掉动画 */
    .todo-announce {
      display: flex; align-items: center; gap: 6px;
      font-size: 11.5px; line-height: 1.6; color: #c9c3b6; min-width: 0;
    }
    .todo-announce-mark {
      flex-shrink: 0; width: 13px; height: 13px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 9px; color: #d98a4f; background: rgba(200, 118, 60, 0.14);
    }
    .todo-announce.is-done .todo-announce-mark { color: #4ade80; background: rgba(74, 222, 128, 0.16); }
    .todo-announce-text {
      position: relative; flex: 1; min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .todo-announce.is-done .todo-announce-text { color: #7c766a; }
    .todo-announce.is-done .todo-announce-text::after {
      content: ""; position: absolute; left: 0; top: 50%; height: 1px; width: 0;
      background: currentColor; animation: todoAnnounceStrike 360ms ease-out forwards;
    }
    @keyframes todoAnnounceStrike { from { width: 0; } to { width: 100%; } }
    .todo-announce-tag {
      flex-shrink: 0; font-size: 10px; padding: 0 5px; border-radius: 999px;
      color: #d98a4f; background: rgba(200, 118, 60, 0.12);
    }
    .todo-announce.is-done .todo-announce-tag { color: #4ade80; background: rgba(74, 222, 128, 0.14); }

    /* 引导卡 */
    .steer-card {
      border: 1px solid rgba(200, 118, 60, 0.22);
      background: rgba(200, 118, 60, 0.09);
      border-left: 2px solid #d98a4f;
      border-radius: 8px; padding: 5px 8px 5px 7px; min-width: 0;
    }
    .steer-card-head {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 0; border: none; background: transparent; cursor: pointer; text-align: left;
    }
    .steer-card-title { font-size: 12px; font-weight: 600; color: #c9c3b6; flex-shrink: 0; }
    .steer-card-preview {
      font-size: 11px; color: #7c766a; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; flex: 1; min-width: 0;
    }
    .steer-card-text {
      margin-top: 4px; font-size: 12px; line-height: 1.65; color: #f4efe6;
      white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow-y: auto;
    }

    /* 工具节点 */
    .think-tool-node { position: relative; margin: 2px 0 7px; animation: fadeIn 160ms ease; }
    .think-tool-mark {
      position: absolute; left: -19px; top: 9px; width: 8px; height: 8px; border-radius: 50%;
      background: #8b93a3;
    }
    .think-tool-btn {
      display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
      background: rgba(200, 118, 60, 0.04);
      border: 1px solid rgba(200, 118, 60, 0.10);
      border-radius: 7px; padding: 4px 8px;
      font-size: 12px; color: #a8a296; transition: background 150ms ease;
      outline: none;
    }
    .think-tool-btn:hover { background: rgba(200, 118, 60, 0.09); }
    .think-tool-btn[data-status="ok"] {
      border-left: 4px solid #4ade80; padding-left: 7px;
    }
    .think-tool-btn[data-status="fail"] {
      border-left: 4px solid #f87171; padding-left: 7px;
    }
    .think-tool-glyph { flex-shrink: 0; font-size: 11px; opacity: 0.9; }
    .think-tool-name {
      flex-shrink: 0; max-width: 30%; font-weight: 600; color: #d98a4f;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .think-tool-cat {
      flex-shrink: 0; font-size: 10px; padding: 1px 5px; border-radius: 7px;
      line-height: 1.4; background: #1a1d24; border: 1px solid #2c2c31; color: #7c766a;
    }
    .think-tool-detail {
      flex: 1 1 auto; min-width: 0; font-size: 11px; color: #7c766a;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .think-tool-detail.is-link { color: #d98a4f; text-decoration: underline dotted; cursor: pointer; }
    .think-tool-status {
      flex-shrink: 0; min-width: 3.6em; display: inline-flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 6px;
      background: rgba(255, 255, 255, 0.10);
    }
    .think-tool-status[data-running="1"] {
      position: relative; isolation: isolate; color: #d98a4f;
      background-color: transparent; animation: toolStatusBreathe 2.4s ease-in-out infinite;
    }
    .think-tool-status[data-running="1"]::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
      background-color: rgba(200, 118, 60, 0.30);
    }
    .think-tool-status[data-settled="1"] { animation: toolStatusSettle 340ms cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes toolStatusBreathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes toolStatusSettle {
      0% { transform: scale(0.86); opacity: 0.35; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .think-tool-chevron {
      flex-shrink: 0; background: transparent; border: none; cursor: pointer;
      padding: 0; display: inline-flex;
    }
    .think-tool-detail-box {
      margin: 4px 0 0 20px; padding: 6px 8px;
      background: rgba(200, 118, 60, 0.05); border-radius: 6px;
      font-size: 11px; line-height: 1.6; color: #a8a296; word-break: break-word;
      max-height: 320px; overflow-y: auto; overscroll-behavior: contain;
    }
    .think-tool-detail-line {
      display: flex; align-items: flex-start; gap: 5px; font-size: 11px; line-height: 1.5;
    }
    .think-tool-detail-text { word-break: break-all; }
    .think-terminal {
      margin: 6px 0 0; padding: 8px; border-radius: 6px;
      background: #0c0e13; border: 1px solid #2c2c31;
      font-family: ui-monospace, Consolas, monospace; font-size: 11px; line-height: 1.55;
      color: #c9c3b6; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-all;
    }
    .think-tool-result { display: flex; align-items: flex-start; gap: 4px; margin-top: 6px; }
    .think-tool-result-mark { flex-shrink: 0; margin-top: 1px; font-size: 10px; }
    .think-tool-result-text { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
    .think-tool-links { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .think-tool-link {
      font-size: 10.5px; color: #d98a4f; background: rgba(200, 118, 60, 0.10);
      border: 1px solid #2c2c31; border-radius: 6px; padding: 2px 7px;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      text-decoration: none;
    }
    .think-tool-link:hover { border-color: #d98a4f; }

    /* 正文排版（对齐 slime：正文 15px / 思考 12.5px） */
    .msg-body-text { font-size: 15px; line-height: 1.75; color: #f4efe6; word-break: break-word; }
    .msg-body-text .md-heading { font-weight: 650; }
    .msg-body-text .md-del { opacity: 0.5; }

    @media (prefers-reduced-motion: reduce) {
      .think-step, .think-tool-node { animation: none; }
      .think-timeline.is-live .think-step-mark { animation: none; }
      .todo-announce.is-done .todo-announce-text::after { animation: none; width: 100%; }
    }
    html[data-animations="off"] .collapse,
    html[data-animations="off"] .stream-fade-unit,
    html[data-animations="off"] .think-step,
    html[data-animations="off"] .think-tool-node,
    html[data-animations="off"] .think-tool-status,
    html[data-animations="off"] .todo-announce.is-done .todo-announce-text::after { transition: none; animation: none !important; }


    /* ══ 参考内容 / 访问来源 / 产物 / diff（对齐 slime 的面板样式） ══ */
    .ref-panel { margin: 4px 0 6px; }
    .ref-panel-head {
      display: flex; align-items: center; gap: 6px;
      font-size: 11.5px; color: #a8a296; font-weight: 600;
    }
    .ref-panel-head.is-button { width: 100%; padding: 0; border: none; background: transparent; cursor: pointer; text-align: left; }
    .ref-panel-head.is-button:hover { color: #d98a4f; }
    .ref-panel-count {
      font-size: 9.5px; font-weight: 500; color: #7c766a;
      padding: 0 5px; border-radius: 999px; border: 1px solid #2c2c31;
    }
    .ref-panel-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
    .ref-chip {
      font-size: 10.5px; color: #c9c3b6; background: #1a1d24;
      border: 1px solid #2c2c31; border-radius: 6px; padding: 2px 7px;
      max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      text-decoration: none; cursor: default;
    }
    a.ref-chip { color: #d98a4f; cursor: pointer; }
    a.ref-chip:hover { border-color: #d98a4f; }

    .product-panel { margin: 8px 0 2px; }
    .product-panel-head { font-size: 11.5px; font-weight: 600; color: #a8a296; margin-bottom: 4px; }
    .product-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .product-card {
      border: 1px solid #2c2c31; border-radius: 8px; background: rgba(200, 118, 60, 0.04);
      overflow: hidden; max-width: 100%;
    }
    .product-card.is-open { flex: 1 1 100%; }
    .product-card-head {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 5px 8px; border: none; background: transparent; cursor: pointer;
      color: #c9c3b6; font-size: 11.5px; text-align: left;
    }
    .product-card-head:hover { background: rgba(200, 118, 60, 0.08); }
    .product-card-icon { font-size: 11px; }
    .product-card-name { font-weight: 600; flex-shrink: 0; color: #d98a4f; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .product-card-stat { flex-shrink: 0; font-size: 10.5px; display: inline-flex; gap: 4px; }
    .product-card-path { flex: 1; min-width: 0; font-size: 10px; color: #7c766a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .product-card-body { padding: 0 6px 6px; }

    .think-diff-block { border: 1px solid #2c2c31; border-radius: 6px; overflow: hidden; margin-top: 6px; }
    .think-diff-header {
      display: flex; align-items: center; gap: 8px; padding: 4px 8px;
      border-bottom: 1px solid #2c2c31; background: #1a1d24;
      font-size: 10.5px; color: #a8a296;
    }
    .think-diff-file { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .think-diff-stat { margin-left: auto; display: inline-flex; gap: 6px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .think-diff-add { color: #3fb950; }
    .think-diff-del { color: #f85149; }
    .think-diff-body { max-height: 260px; overflow: auto; background: #0c0e13; }
    .think-diff-row { display: flex; align-items: flex-start; padding: 0 8px; white-space: pre; min-width: 0; font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; line-height: 1.55; }
    .think-diff-row.diff-add { background: rgba(63, 185, 80, 0.14); }
    .think-diff-row.diff-del { background: rgba(248, 81, 73, 0.14); }
    .think-diff-row.diff-eq { opacity: 0.55; }
    .think-diff-mark { flex-shrink: 0; width: 16px; user-select: none; font-weight: 700; color: #7c766a; }
    .think-diff-row.diff-add .think-diff-mark { color: #3fb950; }
    .think-diff-row.diff-del .think-diff-mark { color: #f85149; }
    .think-diff-text { flex: 1; min-width: 0; word-break: break-all; }
    .think-diff-foot { padding: 3px 8px; font-size: 9.5px; background: #1a1d24; border-top: 1px solid #2c2c31; }
    .think-diff-inline { flex-shrink: 0; display: inline-flex; gap: 4px; font-size: 10px; font-variant-numeric: tabular-nums; }


    .compress-note {
      display: flex; align-items: center; gap: 6px;
      margin: 6px 0 2px; padding: 4px 8px;
      font-size: 11px; color: #c9a585;
      border-left: 2px solid rgba(200, 118, 60, 0.45);
      background: rgba(200, 118, 60, 0.06);
      border-radius: 0 6px 6px 0;
    }
    .compress-note-mark { color: #d98a4f; font-size: 10px; }

    /* ── 会话：思考与正文分隔 / 正文后置闸门 / 吐字光标 / 跟随最新 ── */
    .msg-body-divider {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.09);
      margin: 8px 0 10px;
      opacity: 0.8;
    }
    .stream-gate {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #c9c2b4;
      font-size: 14px;
      font-weight: 500;
    }
    .stream-cursor {
      display: inline-block;
      width: 2px;
      height: 16px;
      margin-left: 3px;
      vertical-align: text-bottom;
      background: #d98a4f;
      animation: blink 1s step-start infinite;
    }
    .msg-think-toggle {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px;
      border: none;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      color: #a8a296;
    }
    .msg-think-toggle.is-open {
      background: rgba(200, 118, 60, 0.14);
      color: #d98a4f;
    }
    .chat-scroll { position: relative; }
    .scroll-fade-mask {
      position: absolute;
      left: 0;
      right: 0;
      height: 44px;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.2s ease;
    }
    .scroll-fade-mask.is-top {
      top: 0;
      background: linear-gradient(to bottom, rgba(17, 19, 24, 0.92), transparent);
    }
    .scroll-fade-mask.is-bottom {
      bottom: 0;
      background: linear-gradient(to top, rgba(17, 19, 24, 0.92), transparent);
    }
    .scroll-fade-mask.is-hidden { opacity: 0; }
    .jump-latest {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 8;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(24, 26, 32, 0.92);
      color: #d98a4f;
      font-size: 11.5px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }

    /* ══════════════════════════════════════════════════════════════════════
       应用内终端（右侧 Agent 面板底部抽屉）
       颜色对齐 theme.ts 的 BRAND：ink #111318 / inkPanel #15171c /
       border #262a31 / borderStrong #333842 / linenMuted #a8a29a /
       linenFaint #6f6a63 / ochre #c8763c / ochreHover #d98a4f / teal #5eead4。
       深色输出区与既有 .think-terminal 工具输出区同色（#0c0e13），视觉统一。
       ══════════════════════════════════════════════════════════════════════ */
    .terminal-panel {
      /* 终端局部主题变量（颜色对齐 theme.ts BRAND；输出区与 .think-terminal 同色，深底更耐读） */
      --terminal-output-bg: #0c0e13;
      --terminal-output-fg: #c9c3b6;
      display: flex;
      flex-direction: column;
      flex: none;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
    }
    /* 高度拖拽条：鼠标拖动 / 方向键 / Home·End（role=separator） */
    .terminal-resizer {
      position: relative;
      flex: none;
      height: 6px;
      cursor: row-resize;
      background: transparent;
      outline: none;
      touch-action: none;
    }
    .terminal-resizer::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 2px;
      width: 44px;
      height: 2px;
      transform: translateX(-50%);
      border-radius: 2px;
      background: #333842;
      transition: background 120ms;
    }
    .terminal-resizer:hover::after,
    .terminal-resizer:focus-visible::after {
      background: #c8763c;
    }
    .terminal-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
      min-height: 24px;
      padding: 0 8px 4px;
    }
    .terminal-profiles {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 0;
      padding: 2px 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    .terminal-profiles::-webkit-scrollbar {
      height: 0;
    }
    .terminal-profile {
      display: inline-flex;
      align-items: center;
      flex: none;
      height: 20px;
      padding: 0 7px;
      border-radius: 10px;
      border: 1px solid #262a31;
      background: transparent;
      color: #a8a29a;
      font-size: 10.5px;
      white-space: nowrap;
      cursor: pointer;
      transition: border-color 120ms, color 120ms, background 120ms, transform 80ms;
    }
    .terminal-profile:hover:not(:disabled) {
      border-color: #c8763c;
      color: #f4efe6;
    }
    .terminal-profile:active:not(:disabled) {
      transform: scale(0.96);
    }
    .terminal-profile.is-active {
      border-color: rgba(200, 118, 60, 0.55);
      background: rgba(200, 118, 60, 0.14);
      color: #d98a4f;
    }
    .terminal-profile:disabled {
      opacity: 0.34;
      cursor: not-allowed;
    }
    .terminal-hint {
      font-size: 10.5px;
      color: #6f6a63;
      white-space: nowrap;
    }
    .terminal-close-btn {
      flex: none;
    }
    .terminal-state {
      flex: none;
      font-size: 10px;
      color: #6f6a63;
    }
    .terminal-state[data-state="ready"] {
      color: #5eead4;
    }
    .terminal-state[data-state="error"] {
      color: #f87171;
    }
    .terminal-notice {
      flex: none;
      padding: 2px 10px;
      font-size: 10.5px;
      color: #d98a4f;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .terminal-tabbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
      padding: 0 8px;
      border-bottom: 1px solid #262a31;
    }
    .terminal-tabs {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .terminal-tabs::-webkit-scrollbar {
      height: 0;
    }
    .terminal-tab {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: none;
      max-width: 150px;
      height: 24px;
      padding: 0 8px;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: #a8a29a;
      font-size: 11px;
      cursor: pointer;
      transition: color 120ms, border-color 120ms, background 120ms;
    }
    .terminal-tab:hover {
      color: #f4efe6;
      background: #1e2127;
    }
    .terminal-tab.is-active {
      color: #f4efe6;
      border-bottom-color: #c8763c;
    }
    .terminal-tab-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .terminal-tab-dot {
      flex: none;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6f6a63;
    }
    .terminal-tab-dot[data-state="ready"] {
      background: #5eead4;
    }
    .terminal-tab-dot[data-state="starting"] {
      background: #c8763c;
      animation: pulseDot 1.6s ease-in-out infinite;
    }
    .terminal-tab-dot[data-state="error"] {
      background: #f87171;
    }
    .terminal-tab-add {
      display: grid;
      place-items: center;
      flex: none;
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: #a8a29a;
      cursor: pointer;
      transition: background 120ms, color 120ms, transform 80ms;
    }
    .terminal-tab-add:hover:not(:disabled) {
      background: #1e2127;
      color: #f4efe6;
    }
    .terminal-tab-add:active:not(:disabled) {
      transform: scale(0.9);
    }
    .terminal-tab-add:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .terminal-actions {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex: none;
      padding-left: 4px;
    }
    .terminal-action {
      height: 20px;
      padding: 0 5px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: #a8a29a;
      font-size: 10px;
      cursor: pointer;
      transition: color 120ms, border-color 120ms, background 120ms;
    }
    .terminal-action:hover:not(:disabled) {
      color: #d98a4f;
      border-color: rgba(200, 118, 60, 0.4);
      background: rgba(200, 118, 60, 0.08);
    }
    .terminal-action:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .terminal-empty {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
      text-align: center;
    }
    .terminal-empty-title {
      font-size: 12px;
      color: #c9c3b6;
    }
    .terminal-empty-hint {
      max-width: 300px;
      font-size: 10.5px;
      line-height: 1.5;
      color: #6f6a63;
    }
    .terminal-empty-btn {
      height: 24px;
      margin-top: 2px;
      padding: 0 12px;
      border: 1px solid #333842;
      border-radius: 7px;
      background: transparent;
      color: #a8a29a;
      font-size: 11.5px;
      cursor: pointer;
    }
    .terminal-empty-btn:hover:not(:disabled) {
      border-color: #c8763c;
      color: #f4efe6;
    }
    .terminal-empty-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .terminal-output-wrap {
      position: relative;
      display: flex;
      flex: 1;
      min-height: 0;
    }
    .terminal-output {
      flex: 1;
      min-height: 0;
      margin: 0;
      padding: 6px 10px;
      overflow: auto;
      overscroll-behavior: contain;
      background: var(--terminal-output-bg);
      color: var(--terminal-output-fg);
      font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
      font-size: 11.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      outline: none;
    }
    .terminal-output:focus-visible {
      box-shadow: inset 0 0 0 1px rgba(200, 118, 60, 0.5);
    }
    .terminal-jump {
      position: absolute;
      right: 10px;
      bottom: 8px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(24, 26, 32, 0.92);
      color: #d98a4f;
      font-size: 10.5px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }
    .terminal-jump:hover {
      border-color: rgba(200, 118, 60, 0.55);
    }
    .terminal-command {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: none;
      padding: 5px 8px;
      border-top: 1px solid #262a31;
    }
    .terminal-prompt {
      flex: none;
      color: #c8763c;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
    }
    .terminal-command-input {
      flex: 1;
      min-width: 0;
      height: 24px;
      padding: 0 8px;
      border: 1px solid #262a31;
      border-radius: 6px;
      background: #111318;
      color: #f4efe6;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11.5px;
      outline: none;
    }
    .terminal-command-input:focus {
      border-color: #6f6a63;
    }
    .terminal-command-input:disabled {
      opacity: 0.5;
    }
    .terminal-raw-toggle {
      flex: none;
      height: 22px;
      padding: 0 7px;
      border: 1px solid #262a31;
      border-radius: 6px;
      background: transparent;
      color: #a8a29a;
      font-size: 10.5px;
      cursor: pointer;
      transition: border-color 120ms, color 120ms, background 120ms;
    }
    .terminal-raw-toggle:hover {
      border-color: #c8763c;
      color: #f4efe6;
    }
    .terminal-raw-toggle.is-on {
      border-color: rgba(200, 118, 60, 0.55);
      background: rgba(200, 118, 60, 0.14);
      color: #d98a4f;
    }
    .terminal-send {
      display: grid;
      place-items: center;
      flex: none;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 6px;
      background: #c8763c;
      cursor: pointer;
      transition: background 120ms, transform 80ms;
    }
    .terminal-send:hover:not(:disabled) {
      background: #d98a4f;
      transform: scale(1.05);
    }
    .terminal-send:active:not(:disabled) {
      transform: scale(0.94);
    }
    .terminal-send:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    /* 焦点环（键盘可达）：终端内的按钮/输入区统一品牌赭石描边 */
    .terminal-profile:focus-visible,
    .terminal-tab:focus-visible,
    .terminal-tab-add:focus-visible,
    .terminal-action:focus-visible,
    .terminal-raw-toggle:focus-visible,
    .terminal-send:focus-visible,
    .terminal-empty-btn:focus-visible,
    .terminal-jump:focus-visible {
      outline: 2px solid rgba(200, 118, 60, 0.6);
      outline-offset: 1px;
    }
    @media (prefers-reduced-motion: reduce) {
      .terminal-tab-dot[data-state="starting"] {
        animation: none;
      }
    }
    html[data-animations="off"] .terminal-tab-dot {
      animation: none !important;
    }
  </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
